name: Android, ChromeOS and Windows

on:
  push:
    branches: [main, hiraia-unified]
    paths:
      - 'packages/mobile/**'
      - 'packages/desktop/**'
      - 'packages/shared/**'
      - 'packages/images/**'
      - 'rag/**'
      - 'finetuning/eval/**'
      - 'deploy/app_artifacts.py'
      - 'deploy/combine-app-artifacts.py'
      - 'scripts/fix-qvac-win32.mjs'
      - 'deploy/restore-native-build-inputs.py'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/native-apps.yml'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

# No pull_request trigger: untrusted PR code must never run beside the signing key.
permissions:
  contents: read
concurrency:
  group: hiraia-native-builds
  cancel-in-progress: false

jobs:
  signed-platforms:
    name: Build and verify both signed APKs
    # Enable only after provisioning the documented runner and private inputs.
    if: vars.HIRAIA_NATIVE_BUILDS == 'enabled'
    runs-on: [self-hosted, macOS, ARM64, hiraia-native]
    timeout-minutes: 120
    env:
      HIRAIA_BUILD_INPUTS_DIR: ${{ vars.HIRAIA_BUILD_INPUTS_DIR }}
      JAVA_HOME: /opt/homebrew/opt/openjdk@17
      # Return the 6 GB Gradle heap when each build finishes on the shared Mac.
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
      # Keep the runner's model servers separate from interactive development.
      PORT: '18088'
      EMBED_PORT: '18090'
      SAMPLES: '5'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch the retrieval vectors
        run: git lfs pull --include='packages/mobile/assets/rag/*.bin'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          # This Mac already retains its local pnpm store between jobs.
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/qvac-android-x64/manifest.json
            build/qvac-android-x64/x86_64
            build/qvac-android-x64/notices
          key: qvac-android-x64-${{ hashFiles('packages/mobile/native/qvac-android-x64.json', 'packages/mobile/native/qvac-x64-overlay/**', 'pnpm-lock.yaml') }}
      - name: Restore private native inputs
        run: python3 deploy/restore-native-build-inputs.py
      - name: Rebuild generated content
        run: |
          python3 rag/pipeline/build-cards-db.py
          python3 packages/mobile/scripts/package-art.py
          git diff --exit-code -- packages/mobile/src/generated/imagePacks.generated.json
      - name: Platform, input and release guards
        run: |
          pnpm --filter @hiraia/mobile qa:platforms
          pnpm --filter @hiraia/mobile exec tsx --test scripts/adaptive-feed.test.mts scripts/review-series.test.mts
          python3 -B -m unittest discover -s packages/mobile/scripts -p 'test_native_abis.py'
          python3 -B -m unittest discover -s deploy -p 'test_native_runner.py'
          python3 -B -m unittest discover -s deploy -p 'test_publish_platforms.py'
          python3 -B -m unittest discover -s deploy -p 'test_all_platforms.py'
          pnpm --filter @hiraia/mobile exec tsc --noEmit
          pnpm --filter @hiraia/mobile exec tsc -p tsconfig.desktop.json --noEmit
      - name: Both platforms (including regression gate and signing)
        run: nice -n 10 pnpm apk
      - name: Locate complete release
        id: release
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = Path(json.loads(Path('build/app-releases/latest.json').read_text())['manifest'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'directory={manifest.parent}\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hiraia-android-chromeos-${{ github.sha }}
          path: ${{ steps.release.outputs.directory }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0 # APKs are already compressed.
      - name: Export the shared Windows renderer
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          nice -n 10 pnpm --filter @hiraia/desktop renderer
          mkdir -p build/desktop-inputs
          tar -czf build/desktop-inputs/renderer.tar.gz -C packages/desktop renderer
          cp '${{ steps.release.outputs.directory }}/release.json' build/desktop-inputs/release.json
          cp '${{ steps.release.outputs.directory }}/regression.log' build/desktop-inputs/regression.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hiraia-desktop-inputs-${{ github.sha }}
          path: build/desktop-inputs/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
      - name: Remove checkout signing material
        if: always()
        run: |
          rm -f packages/mobile/credentials.json packages/mobile/keystores/release.jks
  windows:
    name: Build and verify Windows; complete all three editions
    needs: signed-platforms
    uses: ./.github/workflows/windows-build.yml
    with:
      renderer-artifact: hiraia-desktop-inputs-${{ github.sha }}
