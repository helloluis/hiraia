name: Windows preview
on:
  workflow_dispatch:
  push:
    branches: [codex/windows-preview-20260930]
    paths: ['.github/workflows/windows-preview.yml']
permissions:
  contents: read
jobs:
  preview:
    uses: ./.github/workflows/windows-build.yml
    with:
      renderer-url: ${{ vars.HIRAIA_WINDOWS_PREVIEW_INPUT_URL }}
      renderer-sha256: ${{ vars.HIRAIA_WINDOWS_PREVIEW_INPUT_SHA256 }}
