# tala.hiraia.org — Cloudflare (proxied) -> nginx -> Tala on 127.0.0.1:3220.
# Client addresses are already restored from Cloudflare by /etc/nginx/conf.d/hiraia-cloudflare-realip.conf,
# so the app is given exactly one trusted X-Forwarded-For value (TALA_TRUSTED_PROXY_HOPS=1).
server {
    listen 80;
    server_name tala.hiraia.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt-tala-webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name tala.hiraia.org;

    ssl_certificate /etc/letsencrypt-tala/live/tala.hiraia.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-tala/live/tala.hiraia.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Certificate renewals are answered here too (Cloudflare may fetch the challenge over HTTPS).
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt-tala-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Roster uploads are capped at 5 MB by the app (base64 inside JSON).
    client_max_body_size 8m;

    # The Android app file and its manifest live outside the repository.
    location = /download/tala.apk {
        alias /var/lib/tala/download/tala.apk;
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="tala.apk"' always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /download/tala-apk.json {
        alias /var/lib/tala/download/tala-apk.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
