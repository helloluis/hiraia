<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <!-- Stand base plate -->
  <rect x="30" y="138" width="40" height="7" rx="2.5" fill="#7d8389" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Stand vertical rod -->
  <rect x="46" y="114" width="8" height="26" fill="#7d8389" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Mounting collar -->
  <rect x="38" y="110" width="24" height="8" rx="3" fill="#3f4348" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Cylinder body (clear outer shell) -->
  <rect x="28" y="36" width="44" height="76" rx="4" fill="#e0f7fa" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Water fill inside cylinder -->
  <rect x="30.5" y="82" width="39" height="28" rx="2" fill="#4fc3f7" stroke="none"/>

  <!-- Water surface highlight -->
  <line x1="31" y1="83" x2="69" y2="83" stroke="#37536b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Measurement tick marks on right side -->
  <!-- Major ticks (longer) at every 10px, minor (shorter) at 5px intervals -->
  <!-- bottom of cylinder at y=110, top at y=38 -->
  <line x1="60" y1="110" x2="68" y2="110" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="63" y1="102" x2="68" y2="102" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="94" x2="68" y2="94" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="63" y1="86" x2="68" y2="86" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="78" x2="68" y2="78" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="63" y1="70" x2="68" y2="70" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="62" x2="68" y2="62" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="63" y1="54" x2="68" y2="54" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="46" x2="68" y2="46" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

  <!-- Funnel trapezoid -->
  <polygon points="18,36 82,36 72,24 28,24" fill="#b0bec5" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Funnel rim top -->
  <rect x="26" y="20" width="48" height="7" rx="3" fill="#90a4ae" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Raindrops above funnel -->
  <ellipse cx="36" cy="10" rx="2.5" ry="3.5" fill="#4fc3f7" stroke="#1f2937" stroke-width="1.5"/>
  <ellipse cx="50" cy="5" rx="2.5" ry="3.5" fill="#4fc3f7" stroke="#1f2937" stroke-width="1.5"/>
  <ellipse cx="65" cy="10" rx="2.5" ry="3.5" fill="#4fc3f7" stroke="#1f2937" stroke-width="1.5"/>
</svg>
