<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" width="260" height="160">
  <rect x="0" y="0" width="260" height="160" fill="#2b3a55"/>
  <circle cx="30" cy="36" r="4" fill="#ffffff"/>
  <circle cx="200" cy="22" r="3" fill="#ffffff"/>
  <circle cx="244" cy="120" r="3" fill="#ffffff"/>
  <circle cx="155" cy="138" r="3" fill="#ffffff"/>
  <circle cx="90" cy="20" r="3" fill="#ffffff"/>
  <circle cx="248" cy="60" r="4" fill="#ffffff"/>
  <circle cx="20" cy="110" r="3" fill="#ffffff"/>

  <!-- Sun -->
  <g>
    <line x1="34" y1="80" x2="6" y2="80" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <line x1="34" y1="80" x2="12" y2="56" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <line x1="34" y1="80" x2="12" y2="104" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <line x1="34" y1="80" x2="20" y2="44" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <line x1="34" y1="80" x2="20" y2="116" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="80" r="26" fill="#fbbf24" stroke="#b45309" stroke-width="2.5"/>
  </g>

  <!-- Light rays from Sun toward Earth, forming the shadow cone edges -->
  <line x1="66" y1="64" x2="135" y2="60" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
  <line x1="66" y1="96" x2="135" y2="100" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>

  <!-- Earth's shadow cone (penumbra/umbra) projecting to the right toward the Moon -->
  <path d="M135 60 L226 74 L226 86 L135 100 Z" fill="#1f2937" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" opacity="0.55"/>
  <path d="M135 68 L222 78 L222 82 L135 92 Z" fill="#10151f" stroke="#10151f" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Earth -->
  <circle cx="120" cy="80" r="22" fill="#1565c0" stroke="#1f2937" stroke-width="2.5"/>
  <path d="M104 70 q8 -6 16 -2 q9 4 14 1 q-3 9 -12 11 q-10 2 -14 -4 q-3 -4 -4 -6 Z" fill="#7cb342" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M112 94 q6 -3 12 0 q5 3 9 1 q-3 6 -10 6 q-8 0 -11 -7 Z" fill="#7cb342" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Moon inside the shadow cone, dimmed (eclipsed) -->
  <circle cx="218" cy="80" r="13" fill="#37536b" stroke="#1f2937" stroke-width="2.5"/>
  <circle cx="213" cy="76" r="3" fill="#2b3a55"/>
  <circle cx="222" cy="84" r="2.2" fill="#2b3a55"/>
  <circle cx="219" cy="74" r="1.8" fill="#2b3a55"/>

  <!-- Arrow indicating shadow direction onto Moon -->
  <line x1="150" y1="118" x2="208" y2="118" stroke="#90caf9" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M208 118 L200 113 L200 123 Z" fill="#90caf9" stroke="#90caf9" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
