<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 120" width="260" height="120">
  <!-- ===== NORMAL FAULT (left block) — blocks pulling apart, hanging wall drops down ===== -->
  <!-- left footwall block (stays up), top face raised -->
  <path d="M8 50 L40 50 L40 92 L8 92 Z" fill="#8d6e4f" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="8" y="44" width="32" height="8" fill="#7cb342" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- rock band on footwall -->
  <rect x="8" y="64" width="32" height="7" fill="#5d4632" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- right hanging wall block (dropped down), top face lower -->
  <path d="M44 62 L76 62 L76 100 L44 100 Z" fill="#8d6e4f" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="44" y="56" width="32" height="8" fill="#7cb342" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="44" y="76" width="32" height="7" fill="#5d4632" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- slip arrows: pulling apart (outward) -->
  <path d="M30 36 L14 36" fill="none" stroke="#e53935" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M18 32 L13 36 L18 40" fill="none" stroke="#e53935" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M54 36 L70 36" fill="none" stroke="#e53935" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M66 32 L71 36 L66 40" fill="none" stroke="#e53935" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== REVERSE FAULT (middle block) — blocks pushing together, hanging wall thrust up ===== -->
  <!-- left footwall block -->
  <path d="M96 60 L124 60 L124 100 L96 100 Z" fill="#8d6e4f" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="96" y="54" width="28" height="8" fill="#7cb342" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="96" y="74" width="28" height="7" fill="#5d4632" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- right hanging wall block, thrust UP and overlapping -->
  <path d="M120 48 L152 48 L152 92 L120 92 Z" fill="#8d6e4f" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="120" y="42" width="32" height="8" fill="#7cb342" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="120" y="62" width="32" height="7" fill="#5d4632" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- slip arrows: pushing together (inward) -->
  <path d="M86 36 L102 36" fill="none" stroke="#e53935" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M98 32 L103 36 L98 40" fill="none" stroke="#e53935" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M162 36 L146 36" fill="none" stroke="#e53935" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M150 32 L145 36 L150 40" fill="none" stroke="#e53935" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== STRIKE-SLIP FAULT (right block) — two blocks sliding horizontally past each other ===== -->
  <!-- back block (upper) -->
  <path d="M172 50 L252 50 L252 72 L172 72 Z" fill="#8d6e4f" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="172" y="50" width="80" height="6" fill="#7cb342" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- front block (lower) -->
  <path d="M172 78 L252 78 L252 100 L172 100 Z" fill="#5d4632" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="172" y="78" width="80" height="6" fill="#7cb342" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- fault line between the two blocks -->
  <path d="M172 75 L252 75" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <!-- slip arrows: horizontal opposite directions -->
  <path d="M196 62 L236 62" fill="none" stroke="#e53935" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M230 57 L237 62 L230 67" fill="none" stroke="#e53935" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M228 90 L188 90" fill="none" stroke="#e53935" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M194 85 L187 90 L194 95" fill="none" stroke="#e53935" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
