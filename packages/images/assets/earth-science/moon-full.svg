<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Moon body -->
  <circle cx="60" cy="60" r="52" fill="#f5f0c8" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Crater 1 — large, upper-left area -->
  <circle cx="40" cy="38" r="10" fill="#e8e1a8" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="40" cy="38" r="5" fill="#d4cb88" stroke="none"/>
  <!-- Crater 2 — medium, lower-right -->
  <circle cx="75" cy="72" r="7" fill="#e8e1a8" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="75" cy="72" r="3.5" fill="#d4cb88" stroke="none"/>
  <!-- Crater 3 — small, upper-right -->
  <circle cx="72" cy="36" r="5" fill="#e8e1a8" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="72" cy="36" r="2.5" fill="#d4cb88" stroke="none"/>
  <!-- Crater 4 — tiny, lower-left -->
  <circle cx="42" cy="74" r="4" fill="#e8e1a8" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="42" cy="74" r="2" fill="#d4cb88" stroke="none"/>
</svg>
