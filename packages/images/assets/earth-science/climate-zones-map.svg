<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <rect x="0" y="0" width="240" height="200" fill="#ffffff"/>

  <!-- Map frame with climate bands (top polar -> bottom polar) -->
  <!-- Polar (top) -->
  <rect x="30" y="30" width="180" height="20" fill="#e0f0ff"/>
  <!-- Temperate (upper) -->
  <rect x="30" y="50" width="180" height="22" fill="#90caf9"/>
  <!-- Subtropical/warm transition -->
  <rect x="30" y="72" width="180" height="14" fill="#7cb342"/>
  <!-- Tropical (around equator) -->
  <rect x="30" y="86" width="180" height="28" fill="#ef6c00"/>
  <!-- Subtropical/warm transition -->
  <rect x="30" y="114" width="180" height="14" fill="#7cb342"/>
  <!-- Temperate (lower) -->
  <rect x="30" y="128" width="180" height="22" fill="#90caf9"/>
  <!-- Polar (bottom) -->
  <rect x="30" y="150" width="180" height="20" fill="#e0f0ff"/>

  <!-- Band divider lines -->
  <line x1="30" y1="50" x2="210" y2="50" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="30" y1="72" x2="210" y2="72" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="30" y1="86" x2="210" y2="86" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="30" y1="114" x2="210" y2="114" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="30" y1="128" x2="210" y2="128" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="30" y1="150" x2="210" y2="150" stroke="#1f2937" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Equator line (solid, bold) -->
  <line x1="30" y1="100" x2="210" y2="100" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

  <!-- Map outer border -->
  <rect x="30" y="30" width="180" height="140" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Sun in upper-right corner -->
  <circle cx="218" cy="18" r="11" fill="#fbbf24" stroke="#1f2937" stroke-width="2"/>

  <!-- Direct sun rays hitting the equator (concentrated heat) -->
  <line x1="120" y1="40" x2="120" y2="84" stroke="#e53935" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="120,90 115,80 125,80" fill="#e53935" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="105" y1="44" x2="111" y2="84" stroke="#e53935" stroke-width="2" stroke-linecap="round"/>
  <line x1="135" y1="44" x2="129" y2="84" stroke="#e53935" stroke-width="2" stroke-linecap="round"/>

  <!-- Cooler glancing rays toward poles (top) -->
  <line x1="70" y1="14" x2="55" y2="28" stroke="#ef6c00" stroke-width="2" stroke-linecap="round"/>
  <polygon points="52,30 58,27 56,33" fill="#ef6c00" stroke="#1f2937" stroke-width="1" stroke-linejoin="round"/>
  <line x1="170" y1="14" x2="185" y2="28" stroke="#ef6c00" stroke-width="2" stroke-linecap="round"/>
  <polygon points="188,30 182,27 184,33" fill="#ef6c00" stroke="#1f2937" stroke-width="1" stroke-linejoin="round"/>
</svg>
