<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150">
  <!-- Left green bank - top section -->
  <polygon points="0,0 55,0 45,20 30,35 20,55 10,75 0,80" fill="#7cb342" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left green bank - bottom section -->
  <polygon points="0,80 10,75 25,95 35,115 40,135 30,150 0,150" fill="#7cb342" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Right green bank - top section -->
  <polygon points="120,0 65,0 70,20 80,35 90,55 100,75 110,80 120,75" fill="#7cb342" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right green bank - bottom section -->
  <polygon points="120,75 110,80 95,95 85,115 80,135 90,150 120,150" fill="#7cb342" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- River water body -->
  <path d="M55,0 C60,0 68,5 70,20 C75,38 85,50 90,55 C100,65 110,72 110,80 C110,88 100,92 95,95 C88,100 85,108 85,115 C84,128 88,140 90,150 L80,150 C78,140 74,128 75,115 C75,106 78,98 85,92 C90,87 100,84 100,80 C100,73 90,66 80,56 C75,50 66,38 62,20 C60,10 55,5 55,0 Z" fill="#4fc3f7" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M55,0 L65,0 C68,5 75,38 80,56 C90,66 100,73 100,80 C100,84 90,87 85,92 C78,98 75,106 75,115 C74,128 78,140 80,150 L90,150 C88,140 84,128 85,115 C85,108 88,100 95,95 C100,92 110,88 110,80 C110,72 100,65 90,55 C85,50 75,38 70,20 C68,5 60,0 55,0 Z" fill="#4fc3f7" stroke="none"/>

  <!-- Redrawn full river path cleanly -->
  <path d="M56,0 Q65,10 68,22 Q74,42 88,56 Q102,70 108,80 Q112,90 104,97 Q96,103 90,110 Q82,120 82,135 Q82,143 84,150 L76,150 Q74,143 74,135 Q74,118 82,106 Q88,98 96,92 Q104,86 100,80 Q96,73 84,62 Q72,50 66,30 Q62,14 56,0 Z" fill="#4fc3f7" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- River flow lines (gentle ripples) -->
  <path d="M72,38 Q76,42 74,46" fill="none" stroke="#37536b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M86,62 Q90,66 88,70" fill="none" stroke="#37536b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M96,82 Q98,86 96,90" fill="none" stroke="#37536b" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M88,110 Q90,114 88,118" fill="none" stroke="#37536b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Ground cover / grass tufts on left bank -->
  <ellipse cx="18" cy="30" rx="8" ry="5" fill="#2e7d32" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="8" cy="55" rx="6" ry="4" fill="#2e7d32" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="20" cy="110" rx="7" ry="4" fill="#2e7d32" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Ground cover / grass tufts on right bank -->
  <ellipse cx="102" cy="30" rx="8" ry="5" fill="#2e7d32" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="112" cy="60" rx="6" ry="4" fill="#2e7d32" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="100" cy="110" rx="7" ry="4" fill="#2e7d32" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
