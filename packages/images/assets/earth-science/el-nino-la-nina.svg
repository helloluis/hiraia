<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="380" height="220">
  <rect x="0" y="0" width="380" height="220" fill="#ffffff"/>

  <!-- ===================== LEFT PANEL: EL NINO ===================== -->
  <!-- panel frame -->
  <rect x="10" y="14" width="170" height="192" rx="6" fill="#eaf6fd" stroke="#1f2937" stroke-width="2.2"/>

  <!-- sky -->
  <rect x="12" y="16" width="166" height="86" fill="#cdeafc"/>

  <!-- sun -->
  <circle cx="34" cy="36" r="11" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>

  <!-- ocean body (cool blue base, deeper) -->
  <rect x="12" y="100" width="166" height="104" fill="#37536b"/>
  <!-- mid water band -->
  <rect x="12" y="100" width="166" height="34" fill="#1565c0"/>
  <!-- warm surface water shifted EAST (right side) -->
  <path d="M12 100 L178 100 L178 122 C150 116 120 119 95 121 C70 123 40 118 12 113 Z" fill="#e53935"/>
  <path d="M95 121 C120 119 150 116 178 122 L178 132 C150 128 120 130 95 131 Z" fill="#ef6c00"/>

  <!-- thermocline (cool deep) sloping down to the east -->
  <path d="M12 150 C50 146 95 158 140 172 C158 178 168 182 178 184" fill="none" stroke="#90caf9" stroke-width="2.2" stroke-linecap="round"/>

  <!-- land masses: west (left) and east (right) -->
  <path d="M12 100 L34 100 L26 80 L18 92 Z" fill="#7cb342" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <path d="M156 100 L178 100 L178 78 L168 86 L160 80 Z" fill="#7cb342" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>

  <!-- rain clouds form in the EAST (over warm water, right) -->
  <g stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M118 48 a13 13 0 0 1 26 -3 a11 11 0 0 1 16 11 a10 10 0 0 1 -6 18 l-40 0 a11 11 0 0 1 4 -26 Z" fill="#9aa0a6"/>
  </g>
  <!-- rain -->
  <g stroke="#4fc3f7" stroke-width="2.4" stroke-linecap="round">
    <line x1="120" y1="76" x2="116" y2="88"/>
    <line x1="132" y1="76" x2="128" y2="88"/>
    <line x1="144" y1="76" x2="140" y2="88"/>
    <line x1="156" y1="76" x2="152" y2="88"/>
  </g>

  <!-- weakened trade winds (short, blowing to the east / right) -->
  <g stroke="#1f2937" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="54" y1="118" x2="86" y2="118"/>
    <path d="M86 118 L79 114 M86 118 L79 122"/>
  </g>

  <!-- ===================== RIGHT PANEL: LA NINA ===================== -->
  <!-- panel frame -->
  <rect x="200" y="14" width="170" height="192" rx="6" fill="#eaf6fd" stroke="#1f2937" stroke-width="2.2"/>

  <!-- sky -->
  <rect x="202" y="16" width="166" height="86" fill="#cdeafc"/>

  <!-- sun -->
  <circle cx="346" cy="36" r="11" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>

  <!-- ocean body (cool blue base, deeper) -->
  <rect x="202" y="100" width="166" height="104" fill="#37536b"/>
  <!-- mid water band -->
  <rect x="202" y="100" width="166" height="34" fill="#1565c0"/>
  <!-- warm surface water pooled WEST (left side) -->
  <path d="M202 100 L368 100 L368 113 C340 118 310 123 285 121 C260 119 230 116 202 122 Z" fill="#e53935"/>
  <path d="M285 121 C260 119 230 116 202 122 L202 132 C230 130 260 128 285 131 Z" fill="#ef6c00"/>

  <!-- thermocline (cool deep) sloping down to the west -->
  <path d="M202 184 C212 182 222 178 240 172 C285 158 330 146 368 150" fill="none" stroke="#90caf9" stroke-width="2.2" stroke-linecap="round"/>

  <!-- land masses: west (left) and east (right) -->
  <path d="M202 100 L224 100 L216 80 L208 92 Z" fill="#7cb342" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <path d="M346 100 L368 100 L368 78 L358 86 L350 80 Z" fill="#7cb342" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>

  <!-- rain clouds form in the WEST (over warm water, left) -->
  <g stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M226 48 a13 13 0 0 1 26 -3 a11 11 0 0 1 16 11 a10 10 0 0 1 -6 18 l-40 0 a11 11 0 0 1 4 -26 Z" fill="#9aa0a6"/>
  </g>
  <!-- rain -->
  <g stroke="#4fc3f7" stroke-width="2.4" stroke-linecap="round">
    <line x1="228" y1="76" x2="224" y2="88"/>
    <line x1="240" y1="76" x2="236" y2="88"/>
    <line x1="252" y1="76" x2="248" y2="88"/>
    <line x1="264" y1="76" x2="260" y2="88"/>
  </g>

  <!-- strong trade winds (long, blowing to the west / left) -->
  <g stroke="#1f2937" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="340" y1="118" x2="288" y2="118"/>
    <path d="M288 118 L295 114 M288 118 L295 122"/>
  </g>
</svg>
