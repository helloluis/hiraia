<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 130" width="140" height="130">
  <!-- Cloud: layered ellipses to form a fluffy cloud shape -->
  <!-- Back/lower bumps first -->
  <ellipse cx="38" cy="62" rx="24" ry="20" fill="#bdbdbd" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="102" cy="64" rx="22" ry="18" fill="#bdbdbd" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Main wide body -->
  <ellipse cx="70" cy="70" rx="46" ry="22" fill="#bdbdbd" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Top bumps -->
  <ellipse cx="50" cy="54" rx="24" ry="21" fill="#bdbdbd" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="82" cy="50" rx="22" ry="20" fill="#bdbdbd" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="65" cy="44" rx="20" ry="18" fill="#bdbdbd" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Fill rectangle to cover interior seams -->
  <rect x="24" y="57" width="92" height="22" fill="#bdbdbd" stroke="none"/>
  <!-- Redraw bottom ellipse outline on top to restore clean edge -->
  <ellipse cx="70" cy="70" rx="46" ry="22" fill="none" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Raindrops: teardrop shape = top arc + pointed bottom, 7 drops -->
  <!-- A raindrop: circle top, tapers to point at bottom -->
  <!-- Drop 1 -->
  <path d="M36 88 C30 94 30 104 36 107 C42 104 42 94 36 88 Z" fill="#4fc3f7" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Drop 2 -->
  <path d="M57 90 C51 96 51 106 57 109 C63 106 63 96 57 90 Z" fill="#4fc3f7" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Drop 3 -->
  <path d="M78 88 C72 94 72 104 78 107 C84 104 84 94 78 88 Z" fill="#4fc3f7" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Drop 4 -->
  <path d="M99 90 C93 96 93 106 99 109 C105 106 105 96 99 90 Z" fill="#4fc3f7" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Drop 5 (offset second row) -->
  <path d="M46 108 C40 114 40 124 46 127 C52 124 52 114 46 108 Z" fill="#4fc3f7" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Drop 6 -->
  <path d="M70 106 C64 112 64 122 70 125 C76 122 76 112 70 106 Z" fill="#4fc3f7" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Drop 7 -->
  <path d="M93 108 C87 114 87 124 93 127 C99 124 99 114 93 108 Z" fill="#4fc3f7" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
