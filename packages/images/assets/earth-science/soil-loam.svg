  <ellipse cx="104" cy="80" rx="9" ry="6" fill="#7a4825" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <ellipse cx="112" cy="87" rx="7" ry="5" fill="#5d3418" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <ellipse cx="96" cy="88" rx="8" ry="5" fill="#8d5a2e" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Small scattered bits on top surface -->
  <ellipse cx="55" cy="80" rx="5" ry="3" fill="#5d3418" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="70" cy="78" rx="4" ry="3" fill="#8d5a2e" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="85" cy="80" rx="5" ry="3" fill="#5d3418" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>

