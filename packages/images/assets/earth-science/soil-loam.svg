  <ellipse cx="32" cy="94" rx="4" ry="2.5" fill="#5d3418" stroke="#1f2937" stroke-width="1.4" stroke-linejoin="round"/>
  <ellipse cx="58" cy="94" rx="5" ry="3" fill="#8d5a2e" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
