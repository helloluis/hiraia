  <ellipse cx="28" cy="87" rx="7" ry="5" fill="#5d3418" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <ellipse cx="44" cy="88" rx="8" ry="5" fill="#8d5a2e" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Crumbly texture clods - center -->
  <ellipse cx="60" cy="72" rx="10" ry="6" fill="#7a4825" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <ellipse cx="70" cy="65" rx="9" ry="5" fill="#8d5a2e" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <ellipse cx="80" cy="72" rx="10" ry="6" fill="#6b3f1e" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>

