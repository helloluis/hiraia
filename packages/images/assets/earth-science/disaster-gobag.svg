<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" width="220" height="180">
  <!-- ground line -->
  <line x1="12" y1="158" x2="208" y2="158" stroke="#9aa0a6" stroke-width="2.2" stroke-linecap="round"/>

  <!-- ===== Open backpack ===== -->
  <!-- main body -->
  <path d="M30 70 Q30 48 60 48 Q90 48 90 70 L90 150 Q90 158 82 158 L38 158 Q30 158 30 150 Z" fill="#2e7d32" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- front pocket -->
  <path d="M37 108 L83 108 L83 148 Q83 152 79 152 L41 152 Q37 152 37 148 Z" fill="#7cb342" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- pocket flap / buckle line -->
  <line x1="40" y1="124" x2="80" y2="124" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="55" y="118" width="10" height="12" rx="2" fill="#fbbf24" stroke="#1f2937" stroke-width="2"/>
  <!-- open top flap folded back -->
  <path d="M30 70 Q60 56 90 70 Q90 40 60 36 Q30 40 30 70 Z" fill="#388e3c" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- open mouth shadow -->
  <path d="M36 70 Q60 62 84 70 Q60 78 36 70 Z" fill="#1b4d1f" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <!-- straps -->
  <path d="M84 50 Q98 70 92 110" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M36 50 Q22 72 30 112" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>

  <!-- ===== Water bottle ===== -->
  <rect x="108" y="92" width="22" height="62" rx="6" fill="#4fc3f7" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- cap -->
  <rect x="113" y="80" width="12" height="14" rx="2" fill="#1565c0" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- water level line -->
  <line x1="110" y1="116" x2="128" y2="116" stroke="#1565c0" stroke-width="2"/>

  <!-- ===== Flashlight ===== -->
  <g>
    <!-- body -->
    <rect x="142" y="120" width="46" height="18" rx="5" fill="#37536b" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- head -->
    <path d="M188 116 L200 110 L200 148 L188 142 Z" fill="#7d8389" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- lens -->
    <rect x="196" y="116" width="8" height="26" rx="3" fill="#fbbf24" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- switch -->
    <rect x="158" y="116" width="8" height="6" rx="1.5" fill="#e53935" stroke="#1f2937" stroke-width="1.8"/>
  </g>

  <!-- ===== First-aid kit ===== -->
  <rect x="110" y="32" width="50" height="40" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- lid line -->
  <line x1="110" y1="44" x2="160" y2="44" stroke="#1f2937" stroke-width="2"/>
  <!-- handle -->
  <path d="M126 32 Q135 22 144 32" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <!-- red cross -->
  <rect x="130" y="50" width="10" height="20" rx="1" fill="#e53935" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <rect x="125" y="55" width="20" height="10" rx="1" fill="#e53935" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- ===== Canned food ===== -->
  <ellipse cx="184" cy="80" rx="18" ry="6" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.2"/>
  <path d="M166 80 L166 110 Q166 116 184 116 Q202 116 202 110 L202 80" fill="#cfd3d6" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- can label band -->
  <path d="M166 90 L166 104 Q166 104 184 104 Q202 104 202 104 L202 90 Q184 96 166 90 Z" fill="#ef6c00" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <ellipse cx="184" cy="80" rx="13" ry="4" fill="#7d8389" stroke="#1f2937" stroke-width="1.8"/>
</svg>
