<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="240" height="220">
  <rect x="0" y="0" width="240" height="220" fill="#ffffff"/>

  <!-- Mantle (orange) cut block -->
  <rect x="20" y="60" width="200" height="130" rx="6" fill="#ef6c00" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Hot mantle plumes (lighter tint bands) rising -->
  <path d="M70 188 C66 150 66 110 75 78 C84 110 84 150 80 188 Z" fill="#fb8c00" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <path d="M162 188 C158 150 158 110 167 78 C176 110 176 150 172 188 Z" fill="#fb8c00" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>

  <!-- Magma hot spots at base -->
  <ellipse cx="75" cy="186" rx="16" ry="6" fill="#e53935" stroke="#1f2937" stroke-width="2"/>
  <ellipse cx="167" cy="186" rx="16" ry="6" fill="#e53935" stroke="#1f2937" stroke-width="2"/>

  <!-- Convection loop 1 (left) clockwise -->
  <path d="M77 165 C77 130 77 100 100 92 C123 100 123 130 123 165 C123 178 77 178 77 165 Z" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <!-- arrowheads loop 1 -->
  <path d="M77 120 l-6 8 12 0 Z" fill="#1f2937" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M123 130 l6 -8 -12 0 Z" fill="#1f2937" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M88 173 l-10 -2 5 9 Z" fill="#1f2937" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Convection loop 2 (center-right) counter-clockwise -->
  <path d="M123 165 C123 130 123 100 146 92 C169 100 169 130 169 165 C169 178 123 178 123 165 Z" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <!-- arrowheads loop 2 -->
  <path d="M169 120 l6 8 -12 0 Z" fill="#1f2937" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M123 130 l-6 -8 12 0 Z" fill="#1f2937" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M158 173 l10 -2 -5 9 Z" fill="#1f2937" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Rising arrows (hot) up the plumes -->
  <path d="M75 178 L75 92" fill="none" stroke="#e53935" stroke-width="3" stroke-linecap="round"/>
  <path d="M75 88 l-6 12 12 0 Z" fill="#e53935" stroke="#e53935" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M167 178 L167 92" fill="none" stroke="#e53935" stroke-width="3" stroke-linecap="round"/>
  <path d="M167 88 l-6 12 12 0 Z" fill="#e53935" stroke="#e53935" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Sinking arrows (cool) down the middle and edges -->
  <path d="M121 92 L121 175" fill="none" stroke="#1565c0" stroke-width="3" stroke-linecap="round"/>
  <path d="M121 179 l-6 -12 12 0 Z" fill="#1565c0" stroke="#1565c0" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Crust band (green) on top of mantle -->
  <rect x="20" y="44" width="200" height="18" rx="3" fill="#7cb342" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Plate division gaps in crust -->
  <path d="M97 44 L94 62" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M150 44 L153 62" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Plate motion arrows above crust (plates pulled apart / driven) -->
  <path d="M85 34 L55 34" fill="none" stroke="#5d4632" stroke-width="3" stroke-linecap="round"/>
  <path d="M51 34 l12 -6 0 12 Z" fill="#5d4632" stroke="#5d4632" stroke-width="1.5" stroke-linejoin="round"/>

  <path d="M160 34 L190 34" fill="none" stroke="#5d4632" stroke-width="3" stroke-linecap="round"/>
  <path d="M194 34 l-12 -6 0 12 Z" fill="#5d4632" stroke="#5d4632" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Two converging plate arrows at center gap -->
  <path d="M115 34 L128 34" fill="none" stroke="#5d4632" stroke-width="3" stroke-linecap="round"/>
  <path d="M132 34 l-12 -6 0 12 Z" fill="#5d4632" stroke="#5d4632" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
