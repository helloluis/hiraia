<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100" height="140">
  <!-- Wide cone body: trapezoid shape tapering downward -->
  <polygon
    points="5,15 95,15 62,90 38,90"
    fill="#4fc3f7"
    stroke="#1f2937"
    stroke-width="2.5"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  <!-- Tube at the bottom -->
  <rect
    x="38" y="90" width="24" height="35"
    fill="#37536b"
    stroke="#1f2937"
    stroke-width="2.5"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  <!-- Top rim highlight band -->
  <line
    x1="5" y1="15" x2="95" y2="15"
    stroke="#1f2937"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <!-- Tube bottom opening -->
  <line
    x1="38" y1="125" x2="62" y2="125"
    stroke="#1f2937"
    stroke-width="2.5"
    stroke-linecap="round"
  />
</svg>
