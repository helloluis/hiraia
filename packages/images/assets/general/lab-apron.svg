<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 140" width="110" height="140">
  <!-- Neck loop strap (arc at top) -->
  <path d="M 38 28 Q 55 10 72 28" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left shoulder strap -->
  <path d="M 38 28 L 34 48" fill="none" stroke="#4fc3f7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right shoulder strap -->
  <path d="M 72 28 L 76 48" fill="none" stroke="#4fc3f7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main apron body -->
  <path d="M 28 48 Q 24 52 23 62 L 20 110 Q 20 118 28 118 L 82 118 Q 90 118 90 110 L 87 62 Q 86 52 82 48 Z" fill="#4fc3f7" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Bib (top panel of apron) -->
  <path d="M 34 48 L 34 72 L 76 72 L 76 48 Q 76 44 72 44 L 38 44 Q 34 44 34 48 Z" fill="#37536b" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Pocket on bib -->
  <rect x="44" y="53" width="22" height="14" rx="2" fill="#4fc3f7" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>

  <!-- Waist tie left -->
  <path d="M 20 82 L 4 76 Q 2 74 4 72 L 8 72 Q 10 72 12 74 L 20 78" fill="#37536b" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Waist tie right -->
  <path d="M 90 82 L 106 76 Q 108 74 106 72 L 102 72 Q 100 72 98 74 L 90 78" fill="#37536b" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Waist band seam line -->
  <line x1="20" y1="80" x2="90" y2="80" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
</svg>
