<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <!-- Crown/button stem -->
  <rect x="56" y="10" width="8" height="10" rx="2" fill="#7d8389" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Button top -->
  <rect x="53" y="6" width="14" height="7" rx="3.5" fill="#7d8389" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Side lug / ring connector -->
  <rect x="46" y="16" width="28" height="6" rx="3" fill="#b0bec5" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Outer case (bezel ring) -->
  <circle cx="60" cy="88" r="46" fill="#b0bec5" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Inner bezel ring -->
  <circle cx="60" cy="88" r="40" fill="#fbbf24" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>

  <!-- Face (clock face) -->
  <circle cx="60" cy="88" r="34" fill="#fffde7" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>

  <!-- Hour markers — 12 positions, small rectangles rotated around center -->
  <!-- 12 o'clock -->
  <rect x="58.5" y="57" width="3" height="7" rx="1" fill="#1f2937"/>
  <!-- 3 o'clock -->
  <rect x="89" y="86.5" width="7" height="3" rx="1" fill="#1f2937"/>
  <!-- 6 o'clock -->
  <rect x="58.5" y="112" width="3" height="7" rx="1" fill="#1f2937"/>
  <!-- 9 o'clock -->
  <rect x="24" y="86.5" width="7" height="3" rx="1" fill="#1f2937"/>

  <!-- Minor tick at 1 o'clock -->
  <line x1="75.5" y1="60.5" x2="78" y2="55.5" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Minor tick at 2 o'clock -->
  <line x1="85.5" y1="70.5" x2="90.5" y2="68" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Minor tick at 4 o'clock -->
  <line x1="90.5" y1="108" x2="85.5" y2="105.5" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Minor tick at 5 o'clock -->
  <line x1="78" y1="120.5" x2="75.5" y2="115.5" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Minor tick at 7 o'clock -->
  <line x1="44.5" y1="115.5" x2="42" y2="120.5" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Minor tick at 8 o'clock -->
  <line x1="34.5" y1="105.5" x2="29.5" y2="108" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Minor tick at 10 o'clock -->
  <line x1="29.5" y1="68" x2="34.5" y2="70.5" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Minor tick at 11 o'clock -->
  <line x1="42" y1="55.5" x2="44.5" y2="60.5" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Hour hand (pointing to ~10) -->
  <line x1="60" y1="88" x2="44" y2="72" stroke="#1f2937" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Minute hand (pointing to ~12) -->
  <line x1="60" y1="88" x2="60" y2="61" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Second / sweep hand (pointing to ~2, red) -->
  <line x1="60" y1="88" x2="74" y2="68" stroke="#e53935" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Tail of second hand -->
  <line x1="60" y1="88" x2="52" y2="101" stroke="#e53935" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Center pivot -->
  <circle cx="60" cy="88" r="3.5" fill="#1f2937" stroke="#1f2937" stroke-width="1"/>
</svg>
