<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="160" height="140">
  <!-- Base / foot -->
  <rect x="62" y="124" width="36" height="10" rx="3" fill="#7d8389" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Vertical stand column -->
  <rect x="75" y="44" width="10" height="82" fill="#7d8389" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Pivot triangle cap -->
  <polygon points="80,24 70,46 90,46" fill="#3f4348" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Horizontal beam -->
  <rect x="12" y="42" width="136" height="7" rx="3.5" fill="#8d6e4f" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Pointer / indicator needle (shows balance) -->
  <line x1="80" y1="46" x2="80" y2="62" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- Left pan strings -->
  <line x1="22" y1="49" x2="16" y2="88" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="49" x2="44" y2="88" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- Left pan (shallow bowl shape) -->
  <path d="M10,88 Q30,100 50,88" fill="#fbbf24" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="10" y1="88" x2="50" y2="88" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right pan strings -->
  <line x1="122" y1="49" x2="116" y2="88" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <line x1="138" y1="49" x2="144" y2="88" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- Right pan (shallow bowl shape) -->
  <path d="M110,88 Q130,100 150,88" fill="#fbbf24" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="110" y1="88" x2="150" y2="88" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
</svg>
