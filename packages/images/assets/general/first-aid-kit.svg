<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110" width="120" height="110">
  <!-- Handle at top -->
  <rect x="42" y="6" width="36" height="12" rx="6" ry="6" fill="#e0e0e0" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Main box body -->
  <rect x="10" y="18" width="100" height="78" rx="8" ry="8" fill="#ffffff" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Lid divider line (horizontal crease) -->
  <line x1="10" y1="44" x2="110" y2="44" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- Latch/clasp on lid -->
  <rect x="50" y="38" width="20" height="12" rx="3" ry="3" fill="#bdbdbd" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <rect x="55" y="41" width="10" height="6" rx="2" ry="2" fill="#9e9e9e" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Red cross on front face (below lid line) -->
  <!-- Cross horizontal bar -->
  <rect x="42" y="63" width="36" height="14" rx="2" ry="2" fill="#e53935" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <!-- Cross vertical bar -->
  <rect x="53" y="52" width="14" height="36" rx="2" ry="2" fill="#e53935" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <!-- Hinge details on side (right) -->
  <rect x="106" y="28" width="6" height="8" rx="2" ry="2" fill="#bdbdbd" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <rect x="106" y="52" width="6" height="8" rx="2" ry="2" fill="#bdbdbd" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
