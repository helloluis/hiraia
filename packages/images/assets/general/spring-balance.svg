<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 150" width="80" height="150">
  <!-- Ring at top -->
  <circle cx="40" cy="10" r="7" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top cap of tube -->
  <rect x="27" y="17" width="26" height="8" rx="3" fill="#7d8389" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main tube body -->
  <rect x="27" y="25" width="26" height="90" rx="4" fill="#b0bec5" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Scale markings on right side of tube -->
  <!-- Long tick marks -->
  <line x1="44" y1="32" x2="50" y2="32" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="42" x2="50" y2="42" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="52" x2="50" y2="52" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="62" x2="50" y2="62" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="72" x2="50" y2="72" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="82" x2="50" y2="82" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="92" x2="50" y2="92" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="102" x2="50" y2="102" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="112" x2="50" y2="112" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Short tick marks between long ones -->
  <line x1="46" y1="37" x2="50" y2="37" stroke="#1f2937" stroke-width="1" stroke-linecap="round"/>
  <line x1="46" y1="47" x2="50" y2="47" stroke="#1f2937" stroke-width="1" stroke-linecap="round"/>
  <line x1="46" y1="57" x2="50" y2="57" stroke="#1f2937" stroke-width="1" stroke-linecap="round"/>
  <line x1="46" y1="67" x2="50" y2="67" stroke="#1f2937" stroke-width="1" stroke-linecap="round"/>
  <line x1="46" y1="77" x2="50" y2="77" stroke="#1f2937" stroke-width="1" stroke-linecap="round"/>
  <line x1="46" y1="87" x2="50" y2="87" stroke="#1f2937" stroke-width="1" stroke-linecap="round"/>
  <line x1="46" y1="97" x2="50" y2="97" stroke="#1f2937" stroke-width="1" stroke-linecap="round"/>
  <line x1="46" y1="107" x2="50" y2="107" stroke="#1f2937" stroke-width="1" stroke-linecap="round"/>

  <!-- Indicator window on tube (red pointer indicator) -->
  <rect x="28" y="60" width="14" height="5" rx="1" fill="#e53935" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Spring coils visible inside tube (shown as zigzag lines) -->
  <polyline points="33,26 37,30 33,34 37,38 33,42 37,46 33,50 37,54 33,58" fill="none" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom cap of tube -->
  <rect x="27" y="115" width="26" height="8" rx="3" fill="#7d8389" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hook shaft -->
  <line x1="40" y1="123" x2="40" y2="135" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hook curve -->
  <path d="M40 135 Q40 145 48 145 Q54 145 54 139" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
