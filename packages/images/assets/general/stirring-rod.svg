<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 150" width="40" height="150">
  <!-- Glass rod body -->
  <rect x="16" y="10" width="10" height="132"
        fill="#e0f7fa" stroke="#1f2937" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Rounded top cap -->
  <ellipse cx="21" cy="10" rx="5" ry="3.5"
           fill="#b0bec5" stroke="#1f2937" stroke-width="2.2"
           stroke-linejoin="round"/>
  <!-- Flat bottom cap -->
  <ellipse cx="21" cy="142" rx="5" ry="3"
           fill="#b0bec5" stroke="#1f2937" stroke-width="2.2"
           stroke-linejoin="round"/>
  <!-- Glass highlight stripe -->
  <rect x="18.5" y="13" width="3" height="126"
        fill="#ffffff" stroke="none" opacity="0.55"/>
</svg>
