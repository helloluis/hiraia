<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 140" width="110" height="140">
  <!-- Handle outline (drawn under lens) -->
  <line x1="76" y1="76" x2="103" y2="132" stroke="#1f2937" stroke-width="14" stroke-linecap="round"/>
  <!-- Handle fill -->
  <line x1="76" y1="76" x2="103" y2="132" stroke="#8d6e4f" stroke-width="9" stroke-linecap="round"/>
  <!-- Lens fill -->
  <circle cx="48" cy="48" r="37" fill="#b3e5fc"/>
  <!-- Lens rim -->
  <circle cx="48" cy="48" r="37" fill="none" stroke="#1f2937" stroke-width="5"/>
  <!-- Inner decorative ring -->
  <circle cx="48" cy="48" r="31" fill="none" stroke="#7d8389" stroke-width="1.5"/>
  <!-- Glass sheen highlight (top-left ellipse) -->
  <ellipse cx="35" cy="33" rx="9" ry="5" fill="#e1f5fe" stroke="none" transform="rotate(-35 35 33)"/>
</svg>
