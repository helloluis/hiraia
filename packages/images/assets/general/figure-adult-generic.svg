<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 140" width="80" height="140">
  <!-- Head -->
  <circle cx="40" cy="18" r="13" fill="#ffe0b2" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="35" y="29" width="10" height="7" rx="2" fill="#ffe0b2" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Torso -->
  <rect x="22" y="35" width="36" height="40" rx="6" fill="#4fc3f7" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left arm -->
  <path d="M22,38 Q10,50 12,72" fill="none" stroke="#ffe0b2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22,38 Q10,50 12,72" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm -->
  <path d="M58,38 Q70,50 68,72" fill="none" stroke="#ffe0b2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M58,38 Q70,50 68,72" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left hand -->
  <circle cx="12" cy="74" r="4" fill="#ffe0b2" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right hand -->
  <circle cx="68" cy="74" r="4" fill="#ffe0b2" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Pants/legs base -->
  <rect x="22" y="72" width="36" height="8" rx="3" fill="#37536b" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left leg -->
  <path d="M32,80 L28,115" fill="none" stroke="#37536b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32,80 L28,115" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right leg -->
  <path d="M48,80 L52,115" fill="none" stroke="#37536b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M48,80 L52,115" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left shoe -->
  <ellipse cx="26" cy="117" rx="8" ry="4" fill="#5d4632" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right shoe -->
  <ellipse cx="54" cy="117" rx="8" ry="4" fill="#5d4632" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
