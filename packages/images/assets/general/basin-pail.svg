<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 130" width="110" height="130">
  <!-- Curved handle arc (behind bucket) -->
  <path d="M 32 38 Q 55 8 78 38" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Handle attachment rings left -->
  <circle cx="32" cy="40" r="5" fill="#7d8389" stroke="#1f2937" stroke-width="2"/>
  <!-- Handle attachment rings right -->
  <circle cx="78" cy="40" r="5" fill="#7d8389" stroke="#1f2937" stroke-width="2"/>
  <!-- Pail body (trapezoid: wider at top, narrower at bottom) -->
  <polygon points="18,42 92,42 82,118 28,118" fill="#4fc3f7" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Rim / top band -->
  <rect x="16" y="38" width="78" height="10" rx="3" fill="#37536b" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Bottom band -->
  <rect x="27" y="113" width="56" height="8" rx="2" fill="#37536b" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <!-- Horizontal decorative band mid-pail -->
  <polygon points="22,72 88,72 86,82 24,82" fill="#37536b" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
