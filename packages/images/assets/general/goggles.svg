<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" width="160" height="90">
  <!-- Elastic strap - left side -->
  <path d="M8 42 Q8 30 18 30 L38 30" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
  <!-- Elastic strap - right side -->
  <path d="M152 42 Q152 30 142 30 L122 30" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>

  <!-- Left lens outer frame -->
  <rect x="18" y="22" width="50" height="44" rx="14" ry="14" fill="#37536b" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Left lens inner (lens glass) -->
  <rect x="24" y="28" width="38" height="32" rx="10" ry="10" fill="#4fc3f7" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <!-- Left lens highlight -->
  <ellipse cx="33" cy="36" rx="6" ry="4" fill="#ffffff" fill-opacity="0.45" stroke="none"/>

  <!-- Right lens outer frame -->
  <rect x="92" y="22" width="50" height="44" rx="14" ry="14" fill="#37536b" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Right lens inner (lens glass) -->
  <rect x="98" y="28" width="38" height="32" rx="10" ry="10" fill="#4fc3f7" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right lens highlight -->
  <ellipse cx="107" cy="36" rx="6" ry="4" fill="#ffffff" fill-opacity="0.45" stroke="none"/>

  <!-- Bridge connecting the two lenses -->
  <path d="M68 44 Q80 38 92 44" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
</svg>
