<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 150" width="60" height="150">
  <!-- Base: wide flat trapezoid at bottom -->
  <rect x="14" y="138" width="32" height="7" rx="2" ry="2"
        fill="#7d8389" stroke="#1f2937" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Base stem connector -->
  <rect x="21" y="132" width="18" height="8"
        fill="#7d8389" stroke="#1f2937" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Liquid fill (blue, inside cylinder body, bottom portion) -->
  <rect x="20" y="92" width="20" height="42"
        fill="#4fc3f7" stroke="none"/>
  <!-- Meniscus curve on top of liquid -->
  <path d="M20,92 Q30,97 40,92"
        fill="#4fc3f7" stroke="none"/>
  <!-- Cylinder body (transparent glass — white with slight tint) -->
  <rect x="20" y="8" width="20" height="126"
        fill="#e8f4fd" stroke="#1f2937" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Liquid outline / meniscus drawn on top of glass outline -->
  <path d="M20,92 Q30,97 40,92"
        fill="none" stroke="#37536b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Liquid side lines (to show it's filled below) — subtle -->
  <line x1="20" y1="92" x2="20" y2="134"
        stroke="#37536b" stroke-width="0.8"/>
  <line x1="40" y1="92" x2="40" y2="134"
        stroke="#37536b" stroke-width="0.8"/>
  <!-- Spout / lip at top -->
  <path d="M20,8 Q17,8 17,11 L17,14 L43,14 L43,11 Q43,8 40,8 Z"
        fill="#b0bec5" stroke="#1f2937" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Tick marks on right side of cylinder, evenly spaced -->
  <!-- Major ticks (longer) every ~20 units, minor ticks (shorter) between -->
  <!-- Range: y=18 to y=130, 10 major intervals = spacing ~11.2 -->
  <!-- Major tick at y=18 -->
  <line x1="40" y1="20" x2="47" y2="20"
        stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Minor tick -->
  <line x1="40" y1="26" x2="44" y2="26"
        stroke="#1f2937" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Major tick -->
  <line x1="40" y1="32" x2="47" y2="32"
        stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Minor tick -->
  <line x1="40" y1="38" x2="44" y2="38"
        stroke="#1f2937" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Major tick -->
  <line x1="40" y1="44" x2="47" y2="44"
        stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Minor tick -->
  <line x1="40" y1="50" x2="44" y2="50"
        stroke="#1f2937" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Major tick -->
  <line x1="40" y1="56" x2="47" y2="56"
        stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Minor tick -->
  <line x1="40" y1="62" x2="44" y2="62"
        stroke="#1f2937" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Major tick -->
  <line x1="40" y1="68" x2="47" y2="68"
        stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Minor tick -->
  <line x1="40" y1="74" x2="44" y2="74"
        stroke="#1f2937" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Major tick -->
  <line x1="40" y1="80" x2="47" y2="80"
        stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Minor tick -->
  <line x1="40" y1="86" x2="44" y2="86"
        stroke="#1f2937" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Major tick at liquid level region -->
  <line x1="40" y1="92" x2="47" y2="92"
        stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Minor tick -->
  <line x1="40" y1="98" x2="44" y2="98"
        stroke="#1f2937" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Major tick -->
  <line x1="40" y1="104" x2="47" y2="104"
        stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Minor tick -->
  <line x1="40" y1="110" x2="44" y2="110"
        stroke="#1f2937" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Major tick -->
  <line x1="40" y1="116" x2="47" y2="116"
        stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Minor tick -->
  <line x1="40" y1="122" x2="44" y2="122"
        stroke="#1f2937" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Major tick near bottom -->
  <line x1="40" y1="128" x2="47" y2="128"
        stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Glass highlight (thin light strip on left inner wall) -->
  <line x1="23" y1="15" x2="23" y2="131"
        stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
</svg>
