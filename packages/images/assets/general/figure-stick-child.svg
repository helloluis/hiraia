<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <!-- Head -->
  <circle cx="50" cy="28" r="18" fill="#ffe0b2" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="43" cy="25" r="2.5" fill="#1f2937"/>
  <circle cx="57" cy="25" r="2.5" fill="#1f2937"/>
  <!-- Smile -->
  <path d="M43 33 Q50 40 57 33" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Neck -->
  <line x1="50" y1="46" x2="50" y2="54" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Body (torso) -->
  <line x1="50" y1="54" x2="50" y2="96" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left arm -->
  <line x1="50" y1="62" x2="28" y2="80" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="50" y1="62" x2="72" y2="80" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left leg -->
  <line x1="50" y1="96" x2="33" y2="132" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left foot -->
  <line x1="33" y1="132" x2="24" y2="132" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="50" y1="96" x2="67" y2="132" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right foot -->
  <line x1="67" y1="132" x2="76" y2="132" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
</svg>
