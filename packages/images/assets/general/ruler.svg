<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 48" width="150" height="48">
  <!-- Ruler body: wood yellow color with rounded ends -->
  <rect x="6" y="12" width="138" height="26" rx="3" ry="3"
        fill="#fbbf24" stroke="#1f2937" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Wood grain lines (subtle horizontal lines for texture feel) -->
  <line x1="9" y1="19" x2="141" y2="19"
        stroke="#b45309" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="9" y1="26" x2="141" y2="26"
        stroke="#b45309" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="9" y1="33" x2="141" y2="33"
        stroke="#b45309" stroke-width="0.8" stroke-linecap="round"/>
  <!-- cm tick marks along the top edge — 13 intervals = 12 full-cm ticks + end marks -->
  <!-- Major ticks every ~10px, minor ticks at 5px intervals -->
  <!-- Starting at x=10, spacing ~10px for cm marks, 5px for half-cm marks -->
  <!-- cm 0 edge left -->
  <line x1="10" y1="12" x2="10" y2="22"
        stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- half-cm 0.5 -->
  <line x1="15" y1="12" x2="15" y2="18"
        stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- cm 1 -->
  <line x1="20" y1="12" x2="20" y2="22"
        stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- half-cm 1.5 -->
  <line x1="25" y1="12" x2="25" y2="18"
        stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- cm 2 -->
  <line x1="30" y1="12" x2="30" y2="22"
        stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- half-cm 2.5 -->
  <line x1="35" y1="12" x2="35" y2="18"
        stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- cm 3 -->
  <line x1="40" y1="12" x2="40" y2="22"
        stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- half-cm 3.5 -->
  <line x1="45" y1="12" x2="45" y2="18"
        stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- cm 4 -->
  <line x1="50" y1="12" x2="50" y2="22"
        stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- half-cm 4.5 -->
  <line x1="55" y1="12" x2="55" y2="18"
        stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- cm 5 -->
  <line x1="60" y1="12" x2="60" y2="22"
        stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- half-cm 5.5 -->
  <line x1="65" y1="12" x2="65" y2="18"
        stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- cm 6 -->
  <line x1="70" y1="12" x2="70" y2="22"
        stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- half-cm 6.5 -->
  <line x1="75" y1="12" x2="75" y2="18"
        stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- cm 7 -->
  <line x1="80" y1="12" x2="80" y2="22"
        stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- half-cm 7.5 -->
  <line x1="85" y1="12" x2="85" y2="18"
        stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- cm 8 -->
  <line x1="90" y1="12" x2="90" y2="22"
        stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- half-cm 8.5 -->
  <line x1="95" y1="12" x2="95" y2="18"
        stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- cm 9 -->
  <line x1="100" y1="12" x2="100" y2="22"
        stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- half-cm 9.5 -->
  <line x1="105" y1="12" x2="105" y2="18"
        stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- cm 10 -->
  <line x1="110" y1="12" x2="110" y2="22"
        stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- half-cm 10.5 -->
  <line x1="115" y1="12" x2="115" y2="18"
        stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- cm 11 -->
  <line x1="120" y1="12" x2="120" y2="22"
        stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- half-cm 11.5 -->
  <line x1="125" y1="12" x2="125" y2="18"
        stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- cm 12 -->
  <line x1="130" y1="12" x2="130" y2="22"
        stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <!-- half-cm 12.5 -->
  <line x1="135" y1="12" x2="135" y2="18"
        stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <!-- cm 13 edge right -->
  <line x1="140" y1="12" x2="140" y2="22"
        stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
</svg>
