<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 150" width="130" height="150">

  <!-- Rack base (bottom horizontal bar) -->
  <rect x="10" y="128" width="110" height="14" rx="4" ry="4"
        fill="#8d6e4f" stroke="#1f2937" stroke-width="2.5"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Rack top horizontal bar with three holes -->
  <rect x="10" y="30" width="110" height="14" rx="4" ry="4"
        fill="#8d6e4f" stroke="#1f2937" stroke-width="2.5"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Hole outlines on top bar (left, center, right) -->
  <ellipse cx="38" cy="37" rx="9" ry="5"
           fill="#5d4632" stroke="#1f2937" stroke-width="2"/>
  <ellipse cx="65" cy="37" rx="9" ry="5"
           fill="#5d4632" stroke="#1f2937" stroke-width="2"/>
  <ellipse cx="92" cy="37" rx="9" ry="5"
           fill="#5d4632" stroke="#1f2937" stroke-width="2"/>

  <!-- Left vertical support -->
  <rect x="10" y="30" width="14" height="112" rx="3" ry="3"
        fill="#8d6e4f" stroke="#1f2937" stroke-width="2.5"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Right vertical support -->
  <rect x="106" y="30" width="14" height="112" rx="3" ry="3"
        fill="#8d6e4f" stroke="#1f2937" stroke-width="2.5"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ===== LEFT TEST TUBE (red liquid) ===== -->
  <!-- tube body (glass, clear-ish grey) -->
  <rect x="29" y="38" width="18" height="72" rx="1" ry="1"
        fill="#eceff1" stroke="#1f2937" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- rounded bottom -->
  <ellipse cx="38" cy="110" rx="9" ry="5"
           fill="#eceff1" stroke="#1f2937" stroke-width="2"/>
  <!-- red liquid fill -->
  <rect x="29" y="82" width="18" height="28"
        fill="#e53935" stroke="none"/>
  <!-- liquid surface (ellipse top of liquid) -->
  <ellipse cx="38" cy="82" rx="9" ry="4"
           fill="#ef5350" stroke="none"/>
  <!-- bottom curve over liquid -->
  <ellipse cx="38" cy="110" rx="9" ry="5"
           fill="#c62828" stroke="none"/>
  <!-- tube outline re-drawn on top for crisp border -->
  <rect x="29" y="38" width="18" height="72" rx="1" ry="1"
        fill="none" stroke="#1f2937" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M29 110 Q29 115 38 115 Q47 115 47 110"
        fill="none" stroke="#1f2937" stroke-width="2"
        stroke-linecap="round"/>
  <!-- shine highlight -->
  <rect x="31" y="42" width="4" height="30" rx="2"
        fill="white" stroke="none" opacity="0.55"/>

  <!-- ===== CENTER TEST TUBE (yellow liquid) ===== -->
  <rect x="56" y="38" width="18" height="72" rx="1" ry="1"
        fill="#eceff1" stroke="#1f2937" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="65" cy="110" rx="9" ry="5"
           fill="#eceff1" stroke="#1f2937" stroke-width="2"/>
  <!-- yellow liquid -->
  <rect x="56" y="68" width="18" height="42"
        fill="#fbbf24" stroke="none"/>
  <ellipse cx="65" cy="68" rx="9" ry="4"
           fill="#fde68a" stroke="none"/>
  <ellipse cx="65" cy="110" rx="9" ry="5"
           fill="#b45309" stroke="none"/>
  <!-- re-draw border -->
  <rect x="56" y="38" width="18" height="72" rx="1" ry="1"
        fill="none" stroke="#1f2937" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M56 110 Q56 115 65 115 Q74 115 74 110"
        fill="none" stroke="#1f2937" stroke-width="2"
        stroke-linecap="round"/>
  <rect x="58" y="42" width="4" height="30" rx="2"
        fill="white" stroke="none" opacity="0.55"/>

  <!-- ===== RIGHT TEST TUBE (blue liquid) ===== -->
  <rect x="83" y="38" width="18" height="72" rx="1" ry="1"
        fill="#eceff1" stroke="#1f2937" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="92" cy="110" rx="9" ry="5"
           fill="#eceff1" stroke="#1f2937" stroke-width="2"/>
  <!-- blue liquid -->
  <rect x="83" y="74" width="18" height="36"
        fill="#4fc3f7" stroke="none"/>
  <ellipse cx="92" cy="74" rx="9" ry="4"
           fill="#81d4fa" stroke="none"/>
  <ellipse cx="92" cy="110" rx="9" ry="5"
           fill="#37536b" stroke="none"/>
  <!-- re-draw border -->
  <rect x="83" y="38" width="18" height="72" rx="1" ry="1"
        fill="none" stroke="#1f2937" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M83 110 Q83 115 92 115 Q101 115 101 110"
        fill="none" stroke="#1f2937" stroke-width="2"
        stroke-linecap="round"/>
  <rect x="85" y="42" width="4" height="30" rx="2"
        fill="white" stroke="none" opacity="0.55"/>

</svg>
