<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 110" width="140" height="110">

  <!-- LEFT GLOVE (facing right, palm side) -->
  <!-- Cuff -->
  <rect x="8" y="72" width="36" height="28" rx="4" ry="4"
        fill="#4fc3f7" stroke="#1f2937" stroke-width="2.2"
        stroke-linejoin="round"/>
  <!-- Cuff fold line -->
  <line x1="8" y1="84" x2="44" y2="84"
        stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Palm / hand body -->
  <path d="M10 78 Q8 55 14 42 Q16 32 22 32 Q28 32 28 42 L28 55 Q32 42 35 38 Q38 33 42 35 Q46 37 44 44 L40 56 Q44 46 47 43 Q50 39 53 42 Q56 45 53 53 L49 63 Q52 55 55 53 Q58 51 60 54 Q62 57 59 65 L52 76 Q40 82 10 78 Z"
        fill="#4fc3f7" stroke="#1f2937" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Thumb (left glove, sticking out left/down) -->
  <path d="M14 62 Q6 60 5 54 Q4 48 10 46 Q14 44 16 50 L16 62 Z"
        fill="#4fc3f7" stroke="#1f2937" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Finger knuckle lines on left glove -->
  <line x1="23" y1="43" x2="22" y2="50"
        stroke="#37536b" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="38" y1="44" x2="37" y2="51"
        stroke="#37536b" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="51" y1="49" x2="50" y2="55"
        stroke="#37536b" stroke-width="1.3" stroke-linecap="round"/>

  <!-- RIGHT GLOVE (mirrored, facing left) -->
  <!-- Cuff -->
  <rect x="96" y="72" width="36" height="28" rx="4" ry="4"
        fill="#fbbf24" stroke="#1f2937" stroke-width="2.2"
        stroke-linejoin="round"/>
  <!-- Cuff fold line -->
  <line x1="96" y1="84" x2="132" y2="84"
        stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Palm / hand body (mirrored) -->
  <path d="M130 78 Q132 55 126 42 Q124 32 118 32 Q112 32 112 42 L112 55 Q108 42 105 38 Q102 33 98 35 Q94 37 96 44 L100 56 Q96 46 93 43 Q90 39 87 42 Q84 45 87 53 L91 63 Q88 55 85 53 Q82 51 80 54 Q78 57 81 65 L88 76 Q100 82 130 78 Z"
        fill="#fbbf24" stroke="#1f2937" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Thumb (right glove) -->
  <path d="M126 62 Q134 60 135 54 Q136 48 130 46 Q126 44 124 50 L124 62 Z"
        fill="#fbbf24" stroke="#1f2937" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Finger knuckle lines on right glove -->
  <line x1="117" y1="43" x2="118" y2="50"
        stroke="#b45309" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="102" y1="44" x2="103" y2="51"
        stroke="#b45309" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="89" y1="49" x2="90" y2="55"
        stroke="#b45309" stroke-width="1.3" stroke-linecap="round"/>

</svg>
