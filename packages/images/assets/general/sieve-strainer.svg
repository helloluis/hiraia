<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">

  <!-- Handle (right side, extending outward) -->
  <rect x="112" y="52" width="38" height="14" rx="7" ry="7"
        fill="#8d6e4f" stroke="#1f2937" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Bowl body (shallow ellipse / trapezoid shape) -->
  <!-- Outer bowl silhouette: a wide shallow arc/trapezoid -->
  <path d="M18,50 L30,88 Q80,100 130,88 L142,50 Z"
        fill="#b0bec5" stroke="#1f2937" stroke-width="2.3"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Bowl rim (top ellipse band) -->
  <ellipse cx="80" cy="50" rx="62" ry="10"
           fill="#90a4ae" stroke="#1f2937" stroke-width="2.3"
           stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Mesh holes pattern — rows of small circles inside the bowl -->
  <!-- Row 1 (near top) -->
  <circle cx="46" cy="57" r="2.8" fill="#1f2937"/>
  <circle cx="58" cy="57" r="2.8" fill="#1f2937"/>
  <circle cx="70" cy="57" r="2.8" fill="#1f2937"/>
  <circle cx="82" cy="57" r="2.8" fill="#1f2937"/>
  <circle cx="94" cy="57" r="2.8" fill="#1f2937"/>
  <circle cx="106" cy="57" r="2.8" fill="#1f2937"/>

  <!-- Row 2 -->
  <circle cx="40" cy="68" r="2.8" fill="#1f2937"/>
  <circle cx="52" cy="68" r="2.8" fill="#1f2937"/>
  <circle cx="64" cy="68" r="2.8" fill="#1f2937"/>
  <circle cx="76" cy="68" r="2.8" fill="#1f2937"/>
  <circle cx="88" cy="68" r="2.8" fill="#1f2937"/>
  <circle cx="100" cy="68" r="2.8" fill="#1f2937"/>
  <circle cx="112" cy="68" r="2.8" fill="#1f2937"/>

  <!-- Row 3 -->
  <circle cx="36" cy="79" r="2.8" fill="#1f2937"/>
  <circle cx="48" cy="79" r="2.8" fill="#1f2937"/>
  <circle cx="60" cy="79" r="2.8" fill="#1f2937"/>
  <circle cx="72" cy="79" r="2.8" fill="#1f2937"/>
  <circle cx="84" cy="79" r="2.8" fill="#1f2937"/>
  <circle cx="96" cy="79" r="2.8" fill="#1f2937"/>
  <circle cx="108" cy="79" r="2.8" fill="#1f2937"/>

  <!-- Row 4 (near bottom, fewer holes) -->
  <circle cx="46" cy="89" r="2.8" fill="#1f2937"/>
  <circle cx="58" cy="89" r="2.8" fill="#1f2937"/>
  <circle cx="70" cy="89" r="2.8" fill="#1f2937"/>
  <circle cx="82" cy="89" r="2.8" fill="#1f2937"/>
  <circle cx="94" cy="89" r="2.8" fill="#1f2937"/>

  <!-- Bowl outline redraw on top to keep clean edges -->
  <path d="M18,50 L30,88 Q80,100 130,88 L142,50"
        fill="none" stroke="#1f2937" stroke-width="2.3"
        stroke-linejoin="round" stroke-linecap="round"/>

</svg>
