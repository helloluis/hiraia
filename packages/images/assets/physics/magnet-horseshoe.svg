<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 130" width="110" height="130">
  <!-- Horseshoe magnet: clean U-shape, red body, grey pole tips -->
  <!--
    Design:
      - One filled path for the red horseshoe body (outer U minus inner U hole),
        using the SVG even-odd or nonzero fill with a compound path.
      - Two grey rectangles for the pole tips at the bottom of each arm.
      Center of arc: (55, 62). Outer radius: 47. Inner radius: 24.
      Arms extend from y=62 down to y=110.
  -->

  <!-- Red horseshoe body: compound path (outer contour + inner hole = ring) -->
  <!-- Outer path: left side down, arc over top, right side down -->
  <!-- Inner path (hole): right side up, arc back, left side down -->
  <path
    fill-rule="evenodd"
    d="
      M 8 112
      L 8 62
      A 47 47 0 0 1 102 62
      L 102 112
      L 78 112
      L 78 62
      A 23 23 0 0 0 32 62
      L 32 112
      Z
    "
    fill="#e53935"
    stroke="#1f2937"
    stroke-width="2.5"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Grey pole tip — left arm bottom -->
  <rect x="8" y="88" width="24" height="26" rx="3"
    fill="#9e9e9e" stroke="#1f2937" stroke-width="2.5"
    stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Grey pole tip — right arm bottom -->
  <rect x="78" y="88" width="24" height="26" rx="3"
    fill="#9e9e9e" stroke="#1f2937" stroke-width="2.5"
    stroke-linejoin="round" stroke-linecap="round"/>
</svg>
