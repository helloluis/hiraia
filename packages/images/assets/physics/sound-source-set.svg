<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <!-- DRUM with sticks (top-left) -->
  <ellipse cx="42" cy="40" rx="28" ry="9" fill="#fbbf24" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M14 40 L14 62 A28 9 0 0 0 70 62 L70 40" fill="#e53935" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M16 44 L26 56 M30 45 L40 57 M44 45 L54 57 M58 44 L68 55" fill="none" stroke="#b45309" stroke-width="1.8" stroke-linecap="round"/>
  <!-- drum sticks -->
  <line x1="56" y1="24" x2="78" y2="8" stroke="#8d6e4f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="78" cy="8" r="4" fill="#5d4632" stroke="#1f2937" stroke-width="1.8"/>
  <line x1="62" y1="26" x2="86" y2="14" stroke="#8d6e4f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="86" cy="14" r="4" fill="#5d4632" stroke="#1f2937" stroke-width="1.8"/>
  <!-- drum sound marks -->
  <path d="M6 24 Q1 30 6 36 M11 20 Q3 30 11 40" fill="none" stroke="#37536b" stroke-width="2" stroke-linecap="round"/>

  <!-- HAND BELL (top-right) -->
  <line x1="160" y1="14" x2="160" y2="24" stroke="#5d4632" stroke-width="4" stroke-linecap="round"/>
  <circle cx="160" cy="12" r="4" fill="#8d6e4f" stroke="#1f2937" stroke-width="2"/>
  <path d="M160 24 C146 24 142 42 138 54 L182 54 C178 42 174 24 160 24 Z" fill="#fbbf24" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <ellipse cx="160" cy="54" rx="22" ry="5" fill="#b45309" stroke="#1f2937" stroke-width="2.2"/>
  <circle cx="160" cy="60" r="4" fill="#5d4632" stroke="#1f2937" stroke-width="1.8"/>
  <!-- bell sound marks -->
  <path d="M190 30 Q197 38 190 46 M194 24 Q204 38 194 52" fill="none" stroke="#37536b" stroke-width="2" stroke-linecap="round"/>

  <!-- GUITAR (bottom-left) -->
  <path d="M30 150 C16 150 12 134 22 126 C30 120 28 112 36 108 C46 103 58 110 56 122 C55 130 62 134 60 144 C58 154 42 156 30 150 Z" fill="#8d6e4f" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="40" cy="128" r="8" fill="#5d4632" stroke="#1f2937" stroke-width="2"/>
  <!-- neck -->
  <rect x="56" y="92" width="9" height="34" rx="2" fill="#5d4632" stroke="#1f2937" stroke-width="2.2" transform="rotate(38 60 109)"/>
  <rect x="70" y="80" width="12" height="9" rx="2" fill="#3f4348" stroke="#1f2937" stroke-width="2" transform="rotate(38 76 84)"/>
  <!-- strings -->
  <line x1="40" y1="118" x2="74" y2="84" stroke="#9aa0a6" stroke-width="1.2"/>
  <line x1="44" y1="120" x2="78" y2="86" stroke="#9aa0a6" stroke-width="1.2"/>
  <!-- guitar sound marks -->
  <path d="M14 118 Q7 124 14 130 M9 114 Q0 124 9 134" fill="none" stroke="#37536b" stroke-width="2" stroke-linecap="round"/>

  <!-- SPEAKER (bottom-right) -->
  <rect x="120" y="96" width="44" height="62" rx="5" fill="#37536b" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="142" cy="132" r="14" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.2"/>
  <circle cx="142" cy="132" r="6" fill="#3f4348" stroke="#1f2937" stroke-width="2"/>
  <circle cx="142" cy="108" r="5" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.2"/>
  <!-- speaker sound waves -->
  <path d="M172 116 Q180 132 172 148 M180 110 Q192 132 180 154 M188 104 Q204 132 188 160" fill="none" stroke="#1565c0" stroke-width="2.2" stroke-linecap="round"/>
</svg>
