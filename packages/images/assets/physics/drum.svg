<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 140" width="130" height="140">
  <!-- Drum body (cylinder sides) -->
  <rect x="20" y="62" width="90" height="55" rx="4" fill="#e53935" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Drum body decorative band (middle stripe) -->
  <rect x="20" y="80" width="90" height="18" fill="#b71c1c" stroke="none"/>
  <!-- Band border lines -->
  <line x1="20" y1="80" x2="110" y2="80" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="98" x2="110" y2="98" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Drum bottom ellipse -->
  <ellipse cx="65" cy="117" rx="45" ry="10" fill="#c62828" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Drum top ellipse (drum head/skin) -->
  <ellipse cx="65" cy="62" rx="45" ry="12" fill="#fbbf24" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Drum top skin inner ring (tension ring) -->
  <ellipse cx="65" cy="62" rx="38" ry="9" fill="none" stroke="#b45309" stroke-width="1.5"/>

  <!-- Lug bolts on drum body (left side) -->
  <rect x="24" y="70" width="6" height="8" rx="1.5" fill="#fbbf24" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="24" y="99" width="6" height="8" rx="1.5" fill="#fbbf24" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Lug bolts on drum body (right side) -->
  <rect x="100" y="70" width="6" height="8" rx="1.5" fill="#fbbf24" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="100" y="99" width="6" height="8" rx="1.5" fill="#fbbf24" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Lug bolts on drum body (center-left) -->
  <rect x="57" y="70" width="6" height="8" rx="1.5" fill="#fbbf24" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="57" y="99" width="6" height="8" rx="1.5" fill="#fbbf24" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Drumstick 1 (left stick, angled top-right to bottom-left) -->
  <!-- Stick shaft -->
  <line x1="30" y1="18" x2="78" y2="58" stroke="#8d6e4f" stroke-width="5" stroke-linecap="round"/>
  <!-- Stick tip (bead) -->
  <circle cx="30" cy="18" r="5" fill="#5d4632" stroke="#1f2937" stroke-width="2"/>

  <!-- Drumstick 2 (right stick, angled top-left to bottom-right) -->
  <!-- Stick shaft -->
  <line x1="100" y1="18" x2="52" y2="58" stroke="#8d6e4f" stroke-width="5" stroke-linecap="round"/>
  <!-- Stick tip (bead) -->
  <circle cx="100" cy="18" r="5" fill="#5d4632" stroke="#1f2937" stroke-width="2"/>

  <!-- Cross point highlight where sticks cross -->
  <circle cx="65" cy="38" r="4" fill="#fbbf24" stroke="#1f2937" stroke-width="1.5"/>
</svg>
