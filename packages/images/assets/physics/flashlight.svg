<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 110" width="150" height="110">
  <!-- Light cone beaming to the right -->
  <polygon points="108,32 148,10 148,100 108,78" fill="#fffde7" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Light cone inner bright center -->
  <polygon points="108,40 140,22 140,88 108,70" fill="#fff9c4" stroke="none"/>

  <!-- Flashlight body (main cylinder) -->
  <rect x="28" y="42" width="62" height="26" rx="5" ry="5" fill="#7d8389" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Grip band 1 -->
  <rect x="38" y="42" width="5" height="26" rx="2" ry="2" fill="#3f4348" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Grip band 2 -->
  <rect x="52" y="42" width="5" height="26" rx="2" ry="2" fill="#3f4348" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Grip band 3 -->
  <rect x="66" y="42" width="5" height="26" rx="2" ry="2" fill="#3f4348" stroke="#1f2937" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- End cap (tail) -->
  <rect x="20" y="46" width="10" height="18" rx="4" ry="4" fill="#3f4348" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Flashlight head / bezel (wider front section) -->
  <rect x="88" y="34" width="22" height="42" rx="4" ry="4" fill="#7d8389" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Lens / reflector circle -->
  <ellipse cx="109" cy="55" rx="10" ry="17" fill="#b0bec5" stroke="#1f2937" stroke-width="2.5"/>
  <!-- Lens inner bright spot -->
  <ellipse cx="109" cy="55" rx="6" ry="11" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <!-- Lens highlight dot -->
  <ellipse cx="106" cy="50" rx="2" ry="3" fill="#ffffff" stroke="none"/>

  <!-- On/off button -->
  <circle cx="55" cy="42" r="4" fill="#fbbf24" stroke="#1f2937" stroke-width="2"/>
</svg>
