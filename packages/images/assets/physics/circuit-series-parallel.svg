<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 170" width="220" height="170">
  <!-- ===================== SERIES CIRCUIT (left) ===================== -->
  <!-- wire loop -->
  <rect x="22" y="38" width="74" height="96" rx="8" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- battery (bottom of loop) -->
  <rect x="44" y="125" width="30" height="18" rx="2" fill="#fbbf24" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="50" y="120" width="4" height="6" fill="#9aa0a6" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <rect x="64" y="121" width="4" height="5" fill="#7d8389" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>

  <!-- bulb 1 (top of loop) -->
  <circle cx="40" cy="38" r="12" fill="#fff7cc" stroke="#1f2937" stroke-width="2.4"/>
  <line x1="34" y1="35" x2="46" y2="41" stroke="#b45309" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="34" y1="41" x2="46" y2="35" stroke="#b45309" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="35" y="48" width="10" height="7" rx="1.5" fill="#9aa0a6" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>

  <!-- bulb 2 (top of loop, in line) -->
  <circle cx="78" cy="38" r="12" fill="#fff7cc" stroke="#1f2937" stroke-width="2.4"/>
  <line x1="72" y1="35" x2="84" y2="41" stroke="#b45309" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="72" y1="41" x2="84" y2="35" stroke="#b45309" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="73" y="48" width="10" height="7" rx="1.5" fill="#9aa0a6" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>

  <!-- current direction arrow (series) -->
  <path d="M96 88 q10 0 10 0" fill="none" stroke="#2e7d32" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M100 84 l6 4 -6 4 z" fill="#2e7d32" stroke="#2e7d32" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- ===================== PARALLEL CIRCUIT (right) ===================== -->
  <!-- outer rectangular frame -->
  <rect x="124" y="38" width="84" height="96" rx="8" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- two vertical branch wires connecting top rail to bottom rail -->
  <line x1="150" y1="38" x2="150" y2="134" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="182" y1="38" x2="182" y2="134" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>

  <!-- battery (bottom rail) -->
  <rect x="151" y="125" width="30" height="18" rx="2" fill="#fbbf24" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="157" y="120" width="4" height="6" fill="#9aa0a6" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <rect x="171" y="121" width="4" height="5" fill="#7d8389" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>

  <!-- bulb on left branch -->
  <circle cx="150" cy="86" r="12" fill="#fff7cc" stroke="#1f2937" stroke-width="2.4"/>
  <line x1="144" y1="83" x2="156" y2="89" stroke="#b45309" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="144" y1="89" x2="156" y2="83" stroke="#b45309" stroke-width="1.8" stroke-linecap="round"/>

  <!-- bulb on right branch -->
  <circle cx="182" cy="86" r="12" fill="#fff7cc" stroke="#1f2937" stroke-width="2.4"/>
  <line x1="176" y1="83" x2="188" y2="89" stroke="#b45309" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="176" y1="89" x2="188" y2="83" stroke="#b45309" stroke-width="1.8" stroke-linecap="round"/>

  <!-- current direction arrows on each branch -->
  <path d="M150 116 l-4 -6 8 0 z" fill="#2e7d32" stroke="#2e7d32" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M182 116 l-4 -6 8 0 z" fill="#2e7d32" stroke="#2e7d32" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
