<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="100" height="130">
  <!-- Handle grip (top) -->
  <rect x="42" y="5" width="16" height="8" rx="3" ry="3"
        fill="#8d6e4f" stroke="#1f2937" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Handle neck connecting grip to bell -->
  <rect x="46" y="12" width="8" height="10" rx="2" ry="2"
        fill="#8d6e4f" stroke="#1f2937" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Bell body (dome shape using a path) -->
  <path d="M 50 22
           C 50 22, 22 30, 18 70
           L 18 80
           Q 18 88, 26 88
           L 74 88
           Q 82 88, 82 80
           L 82 70
           C 78 30, 50 22, 50 22 Z"
        fill="#fbbf24" stroke="#1f2937" stroke-width="2.5"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Bell rim band at bottom -->
  <path d="M 18 80 Q 18 88 26 88 L 74 88 Q 82 88 82 80 L 82 76 Q 82 84 74 84 L 26 84 Q 18 84 18 76 Z"
        fill="#b45309" stroke="#1f2937" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Clapper stem -->
  <line x1="50" y1="38" x2="50" y2="80"
        stroke="#5d4632" stroke-width="2.5"
        stroke-linecap="round"/>
  <!-- Clapper ball -->
  <circle cx="50" cy="83" r="5"
          fill="#5d4632" stroke="#1f2937" stroke-width="2"
          stroke-linejoin="round"/>
</svg>
