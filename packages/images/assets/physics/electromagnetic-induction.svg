<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <!-- Coil of wire (loops) -->
  <ellipse cx="118" cy="92" rx="11" ry="34" fill="#fff7e6" stroke="#b87333" stroke-width="2.4" stroke-linejoin="round"/>
  <ellipse cx="130" cy="92" rx="11" ry="34" fill="none" stroke="#b87333" stroke-width="2.4" stroke-linejoin="round"/>
  <ellipse cx="142" cy="92" rx="11" ry="34" fill="none" stroke="#b87333" stroke-width="2.4" stroke-linejoin="round"/>
  <ellipse cx="154" cy="92" rx="11" ry="34" fill="none" stroke="#b87333" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Bar magnet, poles N (red) / S (blue), entering coil from left -->
  <rect x="36" y="80" width="40" height="24" rx="3" fill="#d32f2f" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="76" y="80" width="34" height="24" rx="3" fill="#1565c0" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Motion arrow on the magnet (pushing into coil) -->
  <line x1="56" y1="62" x2="98" y2="62" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M98 62 L90 57 L90 67 Z" fill="#1f2937" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Wires from coil down to galvanometer -->
  <path d="M124 126 L124 144 L96 144 L96 158" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M148 126 L148 144 L150 144 L150 158" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Galvanometer dial -->
  <circle cx="123" cy="158" r="22" fill="#ffffff" stroke="#1f2937" stroke-width="2.4"/>
  <!-- Scale tick marks -->
  <line x1="105" y1="150" x2="109" y2="152" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="123" y1="146" x2="123" y2="150" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="141" y1="150" x2="137" y2="152" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Deflecting needle -->
  <line x1="123" y1="166" x2="135" y2="148" stroke="#e53935" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="123" cy="166" r="3" fill="#1f2937" stroke="#1f2937" stroke-width="1.5"/>
</svg>
