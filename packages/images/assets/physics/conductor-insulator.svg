<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 170" width="220" height="170">
  <!-- ===================== LEFT CIRCUIT: METAL ROD, BULB LIT ===================== -->
  <!-- battery body -->
  <rect x="14" y="118" width="56" height="26" rx="4" fill="#fbbf24" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="14" y="118" width="14" height="26" rx="4" fill="#b45309" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- battery terminals -->
  <rect x="22" y="111" width="8" height="8" rx="2" fill="#9aa0a6" stroke="#1f2937" stroke-width="2"/>
  <rect x="54" y="111" width="8" height="8" rx="2" fill="#9aa0a6" stroke="#1f2937" stroke-width="2"/>

  <!-- wires (copper) -->
  <!-- left wire up to bulb -->
  <path d="M26 111 L26 60 L46 40" fill="none" stroke="#b87333" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- right wire up to gap post -->
  <path d="M58 111 L58 96 L86 96" fill="none" stroke="#b87333" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- wire from bulb down to gap post -->
  <path d="M66 52 L86 72" fill="none" stroke="#b87333" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- gap posts (left circuit) -->
  <rect x="80" y="70" width="8" height="10" rx="1.5" fill="#3f4348" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <rect x="80" y="92" width="8" height="10" rx="1.5" fill="#3f4348" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>

  <!-- metal rod bridging the gap -->
  <rect x="74" y="78" width="22" height="16" rx="3" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="78" y="81" width="14" height="3.5" rx="1.5" fill="#cdd1d5" stroke="none"/>

  <!-- bulb LIT -->
  <!-- glow rays -->
  <g stroke="#fbbf24" stroke-width="2.4" stroke-linecap="round">
    <line x1="56" y1="18" x2="56" y2="9"/>
    <line x1="40" y1="26" x2="33" y2="20"/>
    <line x1="72" y1="26" x2="79" y2="20"/>
    <line x1="35" y1="40" x2="26" y2="38"/>
    <line x1="77" y1="40" x2="86" y2="38"/>
  </g>
  <!-- glass -->
  <circle cx="56" cy="36" r="16" fill="#fef3c7" stroke="#1f2937" stroke-width="2.4"/>
  <!-- filament -->
  <path d="M50 40 L53 31 L56 40 L59 31 L62 40" fill="none" stroke="#e53935" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- base/screw -->
  <rect x="49" y="49" width="14" height="9" rx="1.5" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="50" y1="52" x2="62" y2="52" stroke="#1f2937" stroke-width="1.4"/>
  <line x1="50" y1="55" x2="62" y2="55" stroke="#1f2937" stroke-width="1.4"/>

  <!-- ===================== RIGHT CIRCUIT: WOODEN STICK, BULB DARK ===================== -->
  <!-- battery body -->
  <rect x="150" y="118" width="56" height="26" rx="4" fill="#fbbf24" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="150" y="118" width="14" height="26" rx="4" fill="#b45309" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="158" y="111" width="8" height="8" rx="2" fill="#9aa0a6" stroke="#1f2937" stroke-width="2"/>
  <rect x="190" y="111" width="8" height="8" rx="2" fill="#9aa0a6" stroke="#1f2937" stroke-width="2"/>

  <!-- wires -->
  <path d="M162 111 L162 60 L182 40" fill="none" stroke="#b87333" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M194 111 L194 96 L168 96" fill="none" stroke="#b87333" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M172 52 L168 72" fill="none" stroke="#b87333" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- gap posts (right circuit) -->
  <rect x="164" y="70" width="8" height="10" rx="1.5" fill="#3f4348" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <rect x="164" y="92" width="8" height="10" rx="1.5" fill="#3f4348" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>

  <!-- wooden/plastic stick bridging the gap -->
  <rect x="158" y="78" width="22" height="16" rx="3" fill="#8d6e4f" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <line x1="163" y1="80" x2="163" y2="92" stroke="#5d4632" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="169" y1="80" x2="169" y2="92" stroke="#5d4632" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="175" y1="80" x2="175" y2="92" stroke="#5d4632" stroke-width="1.6" stroke-linecap="round"/>

  <!-- bulb DARK -->
  <!-- glass -->
  <circle cx="172" cy="36" r="16" fill="#cfd8dc" stroke="#1f2937" stroke-width="2.4"/>
  <!-- filament (dim) -->
  <path d="M166 40 L169 31 L172 40 L175 31 L178 40" fill="none" stroke="#7d8389" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- base/screw -->
  <rect x="165" y="49" width="14" height="9" rx="1.5" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="166" y1="52" x2="178" y2="52" stroke="#1f2937" stroke-width="1.4"/>
  <line x1="166" y1="55" x2="178" y2="55" stroke="#1f2937" stroke-width="1.4"/>
</svg>
