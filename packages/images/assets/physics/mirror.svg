  <!-- Handle grip bands -->
  <rect x="43" y="118" width="14" height="3" rx="1.5" fill="#5d4632" stroke="none"/>
  <rect x="43" y="126" width="14" height="3" rx="1.5" fill="#5d4632" stroke="none"/>
  <rect x="43" y="134" width="14" height="3" rx="1.5" fill="#5d4632" stroke="none"/>

  <!-- Mirror frame (outer oval) -->
