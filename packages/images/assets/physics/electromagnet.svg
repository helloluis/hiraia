<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170" width="200" height="170">
  <!-- iron nail: head at lower-right, point at upper-left -->
  <polygon points="158,118 178,108 184,120 164,130" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="42,52 162,116 156,128 36,64" fill="#7d8389" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="42,52 36,64 26,60 34,48" fill="#7d8389" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- coil of wire wrapped around nail shaft -->
  <path d="M62,71 q10,-14 22,-2 q10,12 22,-2 q10,-14 22,-2" fill="none" stroke="#b87333" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M62,71 q-9,9 0,18" fill="none" stroke="#5d4632" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M84,82 q-9,9 0,18" fill="none" stroke="#5d4632" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M106,93 q-9,9 0,18" fill="none" stroke="#5d4632" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M62,89 q10,-14 22,-2 q10,12 22,-2 q10,-14 22,-2" fill="none" stroke="#b87333" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- lead wires to dry cell -->
  <path d="M62,71 C40,55 36,120 70,128" fill="none" stroke="#b87333" stroke-width="3" stroke-linecap="round"/>
  <path d="M128,89 C150,72 158,140 130,142" fill="none" stroke="#b87333" stroke-width="3" stroke-linecap="round"/>

  <!-- dry cell battery -->
  <rect x="66" y="126" width="62" height="30" rx="4" fill="#fbbf24" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="66" y="126" width="14" height="30" rx="4" fill="#b45309" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="126" y="134" width="6" height="14" rx="2" fill="#9aa0a6" stroke="#1f2937" stroke-width="2"/>

  <!-- paperclips attracted at nail tip -->
  <path d="M28,58 q-8,-3 -8,4 q0,7 7,5 q6,-2 5,-7 q-1,-4 -5,-3 q-3,1 -2,4" fill="none" stroke="#9aa0a6" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M18,68 q-8,-3 -8,4 q0,7 7,5 q6,-2 5,-7 q-1,-4 -5,-3 q-3,1 -2,4" fill="none" stroke="#7d8389" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M30,76 q-8,-3 -8,4 q0,7 7,5 q6,-2 5,-7 q-1,-4 -5,-3 q-3,1 -2,4" fill="none" stroke="#9aa0a6" stroke-width="2.4" stroke-linecap="round"/>

  <!-- attraction direction arrow toward nail tip -->
  <path d="M8,40 L26,48" fill="none" stroke="#e53935" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="26,48 19,46 22,52" fill="#e53935" stroke="#e53935" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
