<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">

  <!-- Top face of ice cube -->
  <polygon points="60,12 100,34 60,56 20,34"
    fill="#b3e5fc" stroke="#1f2937" stroke-width="2.2"
    stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Left face of ice cube -->
  <polygon points="20,34 60,56 60,104 20,82"
    fill="#81d4fa" stroke="#1f2937" stroke-width="2.2"
    stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Right face of ice cube -->
  <polygon points="60,56 100,34 100,82 60,104"
    fill="#4fc3f7" stroke="#1f2937" stroke-width="2.2"
    stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Highlight on top face (translucency shimmer) -->
  <polygon points="60,18 90,34 72,44 42,28"
    fill="#e1f5fe" stroke="none" opacity="0.7"/>

  <!-- Small highlight glint on left face -->
  <polygon points="26,42 42,50 42,62 26,54"
    fill="#e1f5fe" stroke="none" opacity="0.5"/>

  <!-- Small highlight glint on right face -->
  <polygon points="94,42 80,50 80,60 94,52"
    fill="#e1f5fe" stroke="none" opacity="0.4"/>

</svg>
