<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 170" width="240" height="170">
  <rect x="0" y="0" width="240" height="170" fill="#ffffff"/>

  <!-- LEFT: single atom Lewis symbol (Oxygen, 6 valence electrons) -->
  <text x="55" y="62" font-family="Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#1f2937">O</text>
  <!-- top pair -->
  <circle cx="48" cy="22" r="4" fill="#1565c0" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="62" cy="22" r="4" fill="#1565c0" stroke="#1f2937" stroke-width="1.5"/>
  <!-- bottom pair -->
  <circle cx="48" cy="78" r="4" fill="#1565c0" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="62" cy="78" r="4" fill="#1565c0" stroke="#1f2937" stroke-width="1.5"/>
  <!-- left single -->
  <circle cx="20" cy="50" r="4" fill="#1565c0" stroke="#1f2937" stroke-width="1.5"/>
  <!-- right single -->
  <circle cx="90" cy="50" r="4" fill="#1565c0" stroke="#1f2937" stroke-width="1.5"/>

  <!-- divider -->
  <line x1="120" y1="20" x2="120" y2="150" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6"/>

  <!-- RIGHT: water molecule H-O-H with shared bonding pairs and lone pairs -->
  <!-- bond lines -->
  <line x1="165" y1="95" x2="148" y2="78" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="187" y1="95" x2="204" y2="78" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>

  <!-- central O -->
  <text x="176" y="108" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f2937">O</text>
  <!-- left H -->
  <text x="138" y="74" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">H</text>
  <!-- right H -->
  <text x="214" y="74" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">H</text>

  <!-- shared bonding pair dots (green) on left bond -->
  <circle cx="160" cy="90" r="3.4" fill="#7cb342" stroke="#1f2937" stroke-width="1.3"/>
  <circle cx="153" cy="83" r="3.4" fill="#7cb342" stroke="#1f2937" stroke-width="1.3"/>
  <!-- shared bonding pair dots (green) on right bond -->
  <circle cx="192" cy="90" r="3.4" fill="#7cb342" stroke="#1f2937" stroke-width="1.3"/>
  <circle cx="199" cy="83" r="3.4" fill="#7cb342" stroke="#1f2937" stroke-width="1.3"/>

  <!-- lone pairs on O: top -->
  <circle cx="170" cy="78" r="3.6" fill="#1565c0" stroke="#1f2937" stroke-width="1.3"/>
  <circle cx="182" cy="78" r="3.6" fill="#1565c0" stroke="#1f2937" stroke-width="1.3"/>
  <!-- lone pairs on O: bottom -->
  <circle cx="170" cy="124" r="3.6" fill="#1565c0" stroke="#1f2937" stroke-width="1.3"/>
  <circle cx="182" cy="124" r="3.6" fill="#1565c0" stroke="#1f2937" stroke-width="1.3"/>
</svg>
