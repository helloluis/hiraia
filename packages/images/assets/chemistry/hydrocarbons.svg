<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <rect x="0" y="0" width="240" height="180" fill="#ffffff"/>

  <!-- Methane structural formula (left) -->
  <!-- bonds -->
  <line x1="60" y1="90" x2="60" y2="48" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="60" y1="90" x2="60" y2="132" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="60" y1="90" x2="24" y2="90" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="60" y1="90" x2="96" y2="90" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>

  <!-- central carbon -->
  <circle cx="60" cy="90" r="14" fill="#dcefd6" stroke="#1f2937" stroke-width="2.4"/>
  <text x="60" y="96" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">C</text>

  <!-- four hydrogens -->
  <circle cx="60" cy="38" r="11" fill="#ffffff" stroke="#1f2937" stroke-width="2.4"/>
  <text x="60" y="43" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">H</text>

  <circle cx="60" cy="142" r="11" fill="#ffffff" stroke="#1f2937" stroke-width="2.4"/>
  <text x="60" y="147" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">H</text>

  <circle cx="14" cy="90" r="11" fill="#ffffff" stroke="#1f2937" stroke-width="2.4"/>
  <text x="14" y="95" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">H</text>

  <circle cx="106" cy="90" r="11" fill="#ffffff" stroke="#1f2937" stroke-width="2.4"/>
  <text x="106" y="95" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">H</text>

  <!-- Benzene ring (right): hexagon with inner circle -->
  <polygon points="183,46 217,66 217,106 183,126 149,106 149,66" fill="#dcefd6" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="183" cy="86" r="22" fill="none" stroke="#1f2937" stroke-width="2.4"/>

  <!-- vertex carbons -->
  <circle cx="183" cy="46" r="3.2" fill="#1f2937"/>
  <circle cx="217" cy="66" r="3.2" fill="#1f2937"/>
  <circle cx="217" cy="106" r="3.2" fill="#1f2937"/>
  <circle cx="183" cy="126" r="3.2" fill="#1f2937"/>
  <circle cx="149" cy="106" r="3.2" fill="#1f2937"/>
  <circle cx="149" cy="66" r="3.2" fill="#1f2937"/>
</svg>
