<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200">
  <!-- Central tetravalent carbon: four bonds to surrounding atoms -->
  <!-- Bond lines from central C to four H atoms -->
  <line x1="70" y1="60" x2="70" y2="26" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="60" x2="70" y2="94" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="60" x2="36" y2="60" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="60" x2="104" y2="60" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Top H -->
  <circle cx="70" cy="20" r="14" fill="#dcefd6" stroke="#1f2937" stroke-width="2.5"/>
  <text x="70" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">H</text>
  <!-- Bottom H -->
  <circle cx="70" cy="100" r="14" fill="#dcefd6" stroke="#1f2937" stroke-width="2.5"/>
  <text x="70" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">H</text>
  <!-- Left H -->
  <circle cx="22" cy="60" r="14" fill="#dcefd6" stroke="#1f2937" stroke-width="2.5"/>
  <text x="22" y="65" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">H</text>
  <!-- Right H -->
  <circle cx="118" cy="60" r="14" fill="#dcefd6" stroke="#1f2937" stroke-width="2.5"/>
  <text x="118" y="65" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">H</text>

  <!-- Central carbon -->
  <circle cx="70" cy="60" r="18" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.5"/>
  <text x="70" y="66" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937" text-anchor="middle">C</text>

  <!-- Carbon chain of three carbons joined in a line (lower section) -->
  <line x1="46" y1="160" x2="92" y2="160" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="116" y1="160" x2="162" y2="160" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>

  <circle cx="30" cy="160" r="16" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.5"/>
  <text x="30" y="166" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">C</text>

  <circle cx="104" cy="160" r="16" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.5"/>
  <text x="104" y="166" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">C</text>

  <circle cx="178" cy="160" r="16" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.5"/>
  <text x="178" y="166" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">C</text>
</svg>
