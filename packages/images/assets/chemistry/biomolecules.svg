  <path d="M142 62 q10 -6 20 0 q10 6 20 0 q6 -4 10 0" fill="none" stroke="#e53935" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="135" cy="50" r="3" fill="#1565c0" stroke="#1f2937" stroke-width="1.4"/>

  <!-- Protein: folded chain of beads (bottom-left) -->
