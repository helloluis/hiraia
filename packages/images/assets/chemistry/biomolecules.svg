<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <rect x="6" y="6" width="208" height="208" rx="10" fill="#ffffff" stroke="#1f2937" stroke-width="2.4"/>
