<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200" width="180" height="200">
  <!-- Beaker body -->
  <path d="M48 112 L48 178 Q48 186 56 186 L124 186 Q132 186 132 178 L132 112" fill="#4fc3f7" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Beaker spout/rim -->
  <path d="M44 112 L62 112" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M118 112 L136 112" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Clear filtered liquid collected in beaker -->
  <path d="M50 150 L50 178 Q50 184 56 184 L124 184 Q130 184 130 178 L130 150 Z" fill="#a8e0fb" stroke="none"/>
  <path d="M50 150 L130 150" fill="none" stroke="#37536b" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Funnel cone -->
  <path d="M44 60 L136 60 L98 108 L82 108 Z" fill="#bcd9ee" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Funnel stem -->
  <path d="M82 108 L82 130 Q82 134 86 134 L94 134 Q98 134 98 130 L98 108" fill="#bcd9ee" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Funnel rim -->
  <ellipse cx="90" cy="60" rx="46" ry="7" fill="#d6eafa" stroke="#1f2937" stroke-width="2.4"/>

  <!-- Filter paper cone inside funnel -->
  <path d="M54 60 L126 60 L96 102 L84 102 Z" fill="#f4efe2" stroke="#b45309" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="90" cy="60" rx="36" ry="5" fill="#f8f4ea" stroke="#b45309" stroke-width="2"/>
  <!-- Folded filter paper edge fold line -->
  <path d="M90 60 L90 100" fill="none" stroke="#d6b87a" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Cloudy mixture poured / sitting in filter paper -->
  <path d="M62 64 Q90 70 118 64 L100 90 Q90 94 80 90 Z" fill="#cdbfa0" stroke="none"/>
  <!-- Residue caught at bottom of paper -->
  <path d="M84 96 Q90 99 96 96 L93 102 Q90 103 87 102 Z" fill="#8d6e4f" stroke="none"/>

  <!-- Pouring stream of cloudy mixture from above -->
  <path d="M90 18 Q88 32 90 46" fill="none" stroke="#cdbfa0" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="90" cy="14" r="3" fill="#cdbfa0" stroke="none"/>

  <!-- Drips of clear liquid from funnel stem into beaker -->
  <path d="M90 138 q-2 4 0 7 q2 -3 0 -7 Z" fill="#a8e0fb" stroke="#37536b" stroke-width="1.2"/>
  <path d="M90 152 q-2 3.5 0 6 q2 -2.5 0 -6 Z" fill="#a8e0fb" stroke="#37536b" stroke-width="1.2"/>
</svg>
