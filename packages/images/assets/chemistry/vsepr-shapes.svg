<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160" width="300" height="160">
  <!-- LINEAR: outer - central - outer in a straight line -->
  <line x1="20" y1="80" x2="80" y2="80" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="20" cy="80" r="13" fill="#7cb342" stroke="#1f2937" stroke-width="2.4"/>
  <circle cx="80" cy="80" r="13" fill="#7cb342" stroke="#1f2937" stroke-width="2.4"/>
  <circle cx="50" cy="80" r="17" fill="#cfe0f0" stroke="#1f2937" stroke-width="2.4"/>
  <text x="20" y="85" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">O</text>
  <text x="80" y="85" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">O</text>
  <text x="50" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">C</text>

  <!-- BENT: central atom with two bonds angled downward -->
  <line x1="150" y1="55" x2="125" y2="100" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="150" y1="55" x2="175" y2="100" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="125" cy="100" r="12" fill="#7cb342" stroke="#1f2937" stroke-width="2.4"/>
  <circle cx="175" cy="100" r="12" fill="#7cb342" stroke="#1f2937" stroke-width="2.4"/>
  <circle cx="150" cy="55" r="17" fill="#dcefd6" stroke="#1f2937" stroke-width="2.4"/>
  <text x="125" y="105" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">H</text>
  <text x="175" y="105" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">H</text>
  <text x="150" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">O</text>

  <!-- TETRAHEDRAL: central atom with four bonds -->
  <line x1="255" y1="80" x2="255" y2="40" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="255" y1="80" x2="222" y2="100" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="255" y1="80" x2="288" y2="100" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="255" y1="80" x2="255" y2="125" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="255" cy="40" r="11" fill="#7cb342" stroke="#1f2937" stroke-width="2.4"/>
  <circle cx="222" cy="100" r="11" fill="#7cb342" stroke="#1f2937" stroke-width="2.4"/>
  <circle cx="288" cy="100" r="11" fill="#7cb342" stroke="#1f2937" stroke-width="2.4"/>
  <circle cx="255" cy="125" r="11" fill="#7cb342" stroke="#1f2937" stroke-width="2.4"/>
  <circle cx="255" cy="80" r="16" fill="#cfe0f0" stroke="#1f2937" stroke-width="2.4"/>
  <text x="255" y="44" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">H</text>
  <text x="222" y="104" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">H</text>
  <text x="288" y="104" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">H</text>
  <text x="255" y="129" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">H</text>
  <text x="255" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">C</text>
</svg>
