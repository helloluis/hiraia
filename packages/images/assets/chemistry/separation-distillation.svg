<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 200" width="230" height="200">
  <!-- Stand base -->
  <rect x="14" y="178" width="46" height="8" rx="2" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Heat source (burner) -->
  <rect x="24" y="166" width="26" height="12" rx="2" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Flame -->
  <path d="M37 166 C29 158 32 150 37 142 C42 150 45 158 37 166 Z" fill="#fbbf24" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M37 164 C33 159 34 154 37 150 C40 154 41 159 37 164 Z" fill="#e53935" stroke="none"/>

  <!-- Round-bottom flask -->
  <path d="M37 142 a25 25 0 1 1 0.01 0 Z" fill="#4fc3f7" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Liquid inside flask (lower portion) -->
  <path d="M16.5 124 a23 23 0 0 0 41 0 Z" fill="#1565c0" stroke="none"/>
  <!-- Flask neck -->
  <path d="M31 99 L31 78 L43 78 L43 99 Z" fill="#cfeffb" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Neck top rim -->
  <rect x="29" y="74" width="16" height="5" rx="1.5" fill="#cfeeff" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Vapor rising in neck -->
  <circle cx="37" cy="92" r="2.4" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.4"/>
  <circle cx="34" cy="84" r="1.8" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.4"/>
  <circle cx="40" cy="80" r="1.8" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.4"/>

  <!-- Slanted condenser tube (outer water jacket) -->
  <path d="M44 67 L150 130 L143 142 L37 79 Z" fill="#aee0f7" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Inner vapor tube (centerline path) -->
  <path d="M40 73 L147 136" fill="none" stroke="#1565c0" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Cooling water inlet/outlet nozzles -->
  <rect x="128" y="116" width="7" height="14" rx="2" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round" transform="rotate(31 131.5 123)"/>
  <rect x="52" y="58" width="7" height="14" rx="2" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round" transform="rotate(31 55.5 65)"/>

  <!-- Cooling water flow arrows -->
  <path d="M138 110 l-10 6" fill="none" stroke="#1565c0" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M129 113 l-1.5 4.5 4.5 -1" fill="none" stroke="#1565c0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Vapor bubbles travelling through condenser -->
  <circle cx="70" cy="89" r="2" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.3"/>
  <circle cx="95" cy="105" r="2" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.3"/>

  <!-- Outlet adapter from condenser tip down to beaker -->
  <path d="M145 137 L153 145 L153 156 L147 156 L147 145 Z" fill="#cfeeff" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Collection beaker -->
  <path d="M138 160 L178 160 L174 196 L142 196 Z" fill="#cfeeff" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Beaker rim -->
  <path d="M135 160 L181 160" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Distillate collected -->
  <path d="M143.5 182 L172.5 182 L174 196 L142 196 Z" fill="#4fc3f7" stroke="none"/>

  <!-- Distillate drips -->
  <path d="M150 158 c-2 2 -2 4 0 5 c2 -1 2 -3 0 -5 Z" fill="#4fc3f7" stroke="#1565c0" stroke-width="1.2"/>
  <path d="M150 170 c-2 2 -2 4 0 5 c2 -1 2 -3 0 -5 Z" fill="#4fc3f7" stroke="#1565c0" stroke-width="1.2"/>
</svg>
