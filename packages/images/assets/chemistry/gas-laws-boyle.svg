<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 200" width="230" height="200">
  <!-- ============ COMPRESSED SYRINGE (small volume, crowded) ============ -->
  <!-- barrel -->
  <rect x="14" y="20" width="40" height="44" rx="4" fill="#e3f2fd" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- nozzle -->
  <rect x="30" y="64" width="8" height="10" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- plunger pushed in (gas region small at bottom) -->
  <rect x="14" y="44" width="40" height="20" fill="#bbdefb" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- plunger rod long (out the top) -->
  <rect x="30" y="4" width="8" height="40" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="22" y="2" width="24" height="6" rx="2" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- crowded particles in small volume -->
  <circle cx="22" cy="50" r="3" fill="#e53935" stroke="#1f2937" stroke-width="1.4"/>
  <circle cx="31" cy="49" r="3" fill="#e53935" stroke="#1f2937" stroke-width="1.4"/>
  <circle cx="40" cy="50" r="3" fill="#e53935" stroke="#1f2937" stroke-width="1.4"/>
  <circle cx="48" cy="50" r="3" fill="#e53935" stroke="#1f2937" stroke-width="1.4"/>
  <circle cx="26" cy="57" r="3" fill="#e53935" stroke="#1f2937" stroke-width="1.4"/>
  <circle cx="35" cy="58" r="3" fill="#e53935" stroke="#1f2937" stroke-width="1.4"/>
  <circle cx="44" cy="57" r="3" fill="#e53935" stroke="#1f2937" stroke-width="1.4"/>
  <circle cx="20" cy="60" r="3" fill="#e53935" stroke="#1f2937" stroke-width="1.4"/>
  <circle cx="48" cy="60" r="3" fill="#e53935" stroke="#1f2937" stroke-width="1.4"/>

  <!-- ============ ARROWS between the two syringes ============ -->
  <line x1="62" y1="42" x2="98" y2="42" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="98,42 90,38 90,46" fill="#1f2937"/>
  <line x1="98" y1="54" x2="62" y2="54" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <polygon points="62,54 70,50 70,58" fill="#1f2937"/>

  <!-- ============ EXPANDED SYRINGE (large volume, sparse) ============ -->
  <!-- barrel -->
  <rect x="106" y="20" width="40" height="44" rx="4" fill="#e3f2fd" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- nozzle -->
  <rect x="122" y="64" width="8" height="10" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- plunger pulled out (gas fills most of barrel) -->
  <rect x="106" y="22" width="40" height="6" fill="#bbdefb" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- short rod -->
  <rect x="122" y="8" width="8" height="14" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="114" y="6" width="24" height="6" rx="2" fill="#9aa0a6" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- sparse particles in large volume -->
  <circle cx="114" cy="36" r="3" fill="#e53935" stroke="#1f2937" stroke-width="1.4"/>
  <circle cx="136" cy="34" r="3" fill="#e53935" stroke="#1f2937" stroke-width="1.4"/>
  <circle cx="124" cy="44" r="3" fill="#e53935" stroke="#1f2937" stroke-width="1.4"/>
  <circle cx="138" cy="52" r="3" fill="#e53935" stroke="#1f2937" stroke-width="1.4"/>
  <circle cx="115" cy="56" r="3" fill="#e53935" stroke="#1f2937" stroke-width="1.4"/>

  <!-- ============ PRESSURE vs VOLUME GRAPH (inverse hyperbola) ============ -->
  <!-- axes -->
  <line x1="22" y1="100" x2="22" y2="186" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="22" y1="186" x2="160" y2="186" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <!-- y axis arrow (P) -->
  <polygon points="22,98 18,106 26,106" fill="#1f2937"/>
  <!-- x axis arrow (V) -->
  <polygon points="162,186 154,182 154,190" fill="#1f2937"/>
  <!-- hyperbola P = k/V -->
  <path d="M30 106 C46 130 56 150 78 162 C100 174 130 178 154 180" fill="none" stroke="#1565c0" stroke-width="3" stroke-linecap="round"/>

  <!-- axis symbols: P (vertical), V (horizontal) -->
  <text x="9" y="106" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">P</text>
  <text x="158" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2937">V</text>

  <!-- PV = k content notation -->
  <text x="100" y="120" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1f2937">PV = k</text>
</svg>
