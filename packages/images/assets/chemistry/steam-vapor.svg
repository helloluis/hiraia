<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="100" height="130">

  <!-- Three wispy steam curls rising upward.
       Each wisp is drawn twice: first a thick white stroke for the body,
       then a thinner dark stroke for the outline, giving a clean filled-curl look. -->

  <!-- Left wisp -->
  <path d="M30 125 C30 112 20 106 24 92 C28 78 40 74 36 60 C32 46 20 42 24 28 C26 20 34 16 32 10"
        fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 125 C30 112 20 106 24 92 C28 78 40 74 36 60 C32 46 20 42 24 28 C26 20 34 16 32 10"
        fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center wisp (tallest) -->
  <path d="M50 128 C50 113 38 106 43 91 C48 76 62 72 57 57 C52 42 38 38 43 23 C46 13 56 9 54 3"
        fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50 128 C50 113 38 106 43 91 C48 76 62 72 57 57 C52 42 38 38 43 23 C46 13 56 9 54 3"
        fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right wisp -->
  <path d="M70 125 C70 112 80 106 76 92 C72 78 60 74 64 60 C68 46 80 42 76 28 C74 20 66 16 68 10"
        fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M70 125 C70 112 80 106 76 92 C72 78 60 74 64 60 C68 46 80 42 76 28 C74 20 66 16 68 10"
        fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
