<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 110" width="130" height="110">
  <!-- Main rock body: irregular rounded polygon -->
  <path d="M 25 75 Q 15 65 18 50 Q 20 32 35 22 Q 52 12 72 15 Q 90 18 102 30 Q 115 44 112 62 Q 110 78 95 88 Q 78 98 58 97 Q 38 96 25 75 Z"
        fill="#9e9e9e" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Facet line 1: upper-left diagonal crack/face -->
  <path d="M 35 22 Q 48 38 45 58 Q 44 68 38 78"
        fill="none" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Facet line 2: right-side face -->
  <path d="M 72 15 Q 80 42 78 65 Q 76 78 70 90"
        fill="none" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Left upper facet fill (slightly lighter) -->
  <path d="M 35 22 Q 52 12 72 15 Q 80 42 78 65 Q 60 55 48 38 Q 48 38 35 22 Z"
        fill="#bdbdbd" stroke="none"/>
  <!-- Re-draw main outline on top to keep it clean -->
  <path d="M 25 75 Q 15 65 18 50 Q 20 32 35 22 Q 52 12 72 15 Q 90 18 102 30 Q 115 44 112 62 Q 110 78 95 88 Q 78 98 58 97 Q 38 96 25 75 Z"
        fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Facet lines on top -->
  <path d="M 35 22 Q 48 38 45 58 Q 44 68 38 78"
        fill="none" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 72 15 Q 80 42 78 65 Q 76 78 70 90"
        fill="none" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
