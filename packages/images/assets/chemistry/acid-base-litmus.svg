<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 180" width="230" height="180">
  <!-- LEFT: acid side (lemon + red litmus paper) -->
  <!-- lemon body -->
  <ellipse cx="56" cy="120" rx="40" ry="28" fill="#fbbf24" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- lemon nub left -->
  <path d="M16 120 q-7 0 -10 -4 q5 -4 11 -3 z" fill="#fbbf24" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- lemon nub right -->
  <path d="M96 120 q7 0 10 -4 q-5 -4 -11 -3 z" fill="#fbbf24" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- lemon highlight line -->
  <path d="M34 106 q22 -10 44 0" fill="none" stroke="#1f2937" stroke-width="1.6" stroke-linecap="round" opacity="0.4"/>
  <!-- small leaf on lemon -->
  <path d="M56 92 q14 -8 24 -2 q-8 10 -24 2 z" fill="#7cb342" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- red litmus paper strip beside lemon -->
  <rect x="100" y="64" width="18" height="78" rx="3" fill="#e53935" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <line x1="109" y1="74" x2="109" y2="132" stroke="#1f2937" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/>

  <!-- RIGHT: base side (soap bar + blue litmus paper) -->
  <!-- blue litmus paper strip beside soap -->
  <rect x="116" y="64" width="18" height="78" rx="3" fill="#1565c0" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <line x1="125" y1="74" x2="125" y2="132" stroke="#1f2937" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/>

  <!-- soap bar (rounded box with bubbles) -->
  <rect x="140" y="100" width="74" height="44" rx="10" fill="#4fc3f7" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="140" y="100" width="74" height="14" rx="10" fill="#4fc3f7" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- bubbles above soap -->
  <circle cx="160" cy="86" r="7" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="178" cy="76" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="196" cy="88" r="6" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
</svg>
