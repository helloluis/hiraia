<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110" width="120" height="110">
  <!-- Outer lips / mouth surround -->
  <path d="M10 45 Q15 20 60 18 Q105 20 110 45 Q112 70 100 88 Q82 104 60 105 Q38 104 20 88 Q8 70 10 45 Z" fill="#e57373" stroke="#1f2937" stroke-width="2.3" stroke-linejoin="round"/>
  <!-- Mouth cavity (dark interior) -->
  <path d="M18 46 Q20 28 60 26 Q100 28 102 46 Q104 68 94 84 Q78 98 60 99 Q42 98 26 84 Q16 68 18 46 Z" fill="#1f2937"/>
  <!-- Throat / dark back -->
  <ellipse cx="60" cy="82" rx="26" ry="18" fill="#3f4348"/>
  <!-- Upper gum band -->
  <path d="M22 48 Q60 42 98 48" fill="none" stroke="#ffe0b2" stroke-width="6" stroke-linecap="round"/>
  <!-- Upper teeth row -->
  <!-- Tooth 1 left -->
  <rect x="24" y="43" width="13" height="16" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Tooth 2 -->
  <rect x="38" y="41" width="13" height="18" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Tooth 3 center-left -->
  <rect x="52" y="40" width="13" height="19" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Tooth 4 center-right -->
  <rect x="55" y="40" width="13" height="19" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Tooth 5 -->
  <rect x="69" y="41" width="13" height="18" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Tooth 6 right -->
  <rect x="83" y="43" width="13" height="16" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Lower gum band -->
  <path d="M26 88 Q60 94 94 88" fill="none" stroke="#ffe0b2" stroke-width="6" stroke-linecap="round"/>
  <!-- Lower teeth row -->
  <!-- Lower tooth 1 left -->
  <rect x="28" y="78" width="12" height="14" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Lower tooth 2 -->
  <rect x="41" y="76" width="12" height="16" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Lower tooth 3 -->
  <rect x="54" y="75" width="12" height="17" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Lower tooth 4 -->
  <rect x="54" y="75" width="12" height="17" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Lower tooth 5 -->
  <rect x="67" y="76" width="12" height="16" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Lower tooth 6 right -->
  <rect x="80" y="78" width="12" height="14" rx="3" fill="#ffffff" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Tongue body -->
  <path d="M28 72 Q30 55 60 52 Q90 55 92 72 Q92 90 80 96 Q70 101 60 101 Q50 101 40 96 Q28 90 28 72 Z" fill="#f48fb1" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Tongue center groove -->
  <path d="M60 55 Q60 78 60 98" fill="none" stroke="#e91e8c" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <!-- Tongue tip slight curve -->
  <path d="M44 96 Q60 104 76 96" fill="none" stroke="#e91e8c" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Taste buds (small dots on tongue surface) -->
  <circle cx="48" cy="68" r="2.5" fill="#f06292" stroke="#c2185b" stroke-width="1"/>
  <circle cx="60" cy="64" r="2.5" fill="#f06292" stroke="#c2185b" stroke-width="1"/>
  <circle cx="72" cy="68" r="2.5" fill="#f06292" stroke="#c2185b" stroke-width="1"/>
  <circle cx="44" cy="78" r="2" fill="#f06292" stroke="#c2185b" stroke-width="1"/>
  <circle cx="55" cy="76" r="2" fill="#f06292" stroke="#c2185b" stroke-width="1"/>
  <circle cx="65" cy="76" r="2" fill="#f06292" stroke="#c2185b" stroke-width="1"/>
  <circle cx="76" cy="78" r="2" fill="#f06292" stroke="#c2185b" stroke-width="1"/>
  <!-- Upper lip shape (over mouth) -->
  <path d="M10 45 Q15 30 35 24 Q48 19 60 19 Q72 19 85 24 Q105 30 110 45 Q105 38 90 34 Q75 29 60 29 Q45 29 30 34 Q15 38 10 45 Z" fill="#e53935" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Upper lip cupid bow -->
  <path d="M36 32 Q44 27 55 30 Q60 31 65 30 Q76 27 84 32" fill="none" stroke="#b71c1c" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Lower lip shape -->
  <path d="M10 45 Q12 65 20 80 Q10 68 10 45 Z" fill="#e53935" stroke="none"/>
  <path d="M110 45 Q108 65 100 80 Q110 68 110 45 Z" fill="#e53935" stroke="none"/>
  <!-- Lower lip front -->
  <path d="M20 80 Q28 96 60 100 Q92 96 100 80 Q92 92 60 94 Q28 92 20 80 Z" fill="#e53935" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Lower lip highlight curve -->
  <path d="M36 90 Q60 98 84 90" fill="none" stroke="#ef9a9a" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
