<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">

  <!-- Surface / table being touched -->
  <rect x="5" y="108" width="110" height="16" rx="2" ry="2"
        fill="#8d6e4f" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Surface texture lines -->
  <line x1="5" y1="116" x2="115" y2="116" stroke="#5d4632" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Wrist / lower palm -->
  <path d="M30,108 L28,128 Q60,133 92,128 L90,108 Z"
        fill="#ffe0b2" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Wrist crease -->
  <path d="M30,118 Q60,122 90,118" stroke="#c49060" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Main palm + fingers silhouette -->
  <path d="M32,108
           L30,70 C30,65 33,62 37,62 C41,62 44,65 44,70
           L44,58 C44,53 47,50 51,50 C55,50 58,53 58,58
           L58,55 C58,50 61,47 65,47 C69,47 72,50 72,55
           L72,60 C74,57 77,56 80,57 C84,58 86,62 85,67
           L82,90 C80,100 71,108 60,108 Z"
        fill="#ffe0b2" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Thumb -->
  <path d="M32,108 C28,105 24,99 24,92 L24,76 C24,71 27,68 31,68 C35,68 37,71 37,76 L37,90"
        fill="#ffe0b2" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Thumb fill -->
  <path d="M24,92 C24,88 24,80 24,76 C24,71 27,68 31,68 C35,68 37,71 37,76 L37,88 C35,92 30,95 26,94 Z"
        fill="#ffcc9a" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Finger separation lines -->
  <line x1="44" y1="70" x2="44" y2="85" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="58" y1="58" x2="58" y2="83" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="72" y1="60" x2="72" y2="84" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Fingertip rounded caps -->
  <!-- Index -->
  <path d="M30,70 C30,62 44,62 44,70" fill="#ffcc9a" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Middle -->
  <path d="M44,58 C44,50 58,50 58,58" fill="#ffcc9a" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ring -->
  <path d="M58,55 C58,47 72,47 72,55" fill="#ffcc9a" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pinky -->
  <path d="M72,60 C72,54 84,54 84,62" fill="#ffcc9a" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Knuckle / palm crease lines -->
  <path d="M38,90 Q42,87 47,87" stroke="#c49060" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M51,87 Q56,84 61,84" stroke="#c49060" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M65,88 Q69,85 74,86" stroke="#c49060" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M34,98 Q48,94 62,96 Q72,97 80,93" stroke="#c49060" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Sensing / touch marks near fingertips — small radiating lines -->
  <!-- Index fingertip sensing marks -->
  <line x1="37" y1="61" x2="34" y2="56" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="37" y1="61" x2="37" y2="55" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="37" y1="61" x2="40" y2="56" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Middle fingertip sensing marks -->
  <line x1="51" y1="49" x2="48" y2="44" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="51" y1="49" x2="51" y2="43" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="51" y1="49" x2="54" y2="44" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

  <!-- Ring fingertip sensing marks -->
  <line x1="65" y1="47" x2="62" y2="42" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="65" y1="47" x2="65" y2="41" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <line x1="65" y1="47" x2="68" y2="42" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

</svg>
