<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="100" height="130">
  <!-- Outer ear (pinna) in right-side view, skin-tone -->

  <!-- Main pinna outer shell -->
  <path d="M 52 10
             C 70 10, 85 28, 85 55
             C 85 82, 70 108, 52 118
             C 44 122, 36 120, 30 114
             C 24 108, 22 98, 24 88
             C 26 78, 32 72, 34 65
             C 36 58, 34 50, 36 42
             C 38 32, 44 10, 52 10 Z"
        fill="#ffe0b2" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Antihelix (inner curved ridge — upper fork) -->
  <path d="M 44 22
             C 52 20, 62 28, 64 42
             C 66 52, 60 60, 56 68
             C 54 74, 54 82, 52 90"
        fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Antihelix lower arm (crus) -->
  <path d="M 56 68
             C 60 72, 66 72, 68 68"
        fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Concha bowl -->
  <path d="M 36 62
             C 38 54, 46 50, 54 52
             C 62 54, 66 62, 62 72
             C 58 80, 48 84, 42 80
             C 36 76, 34 70, 36 62 Z"
        fill="#ffcc80" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Ear canal opening (dark oval) -->
  <ellipse cx="46" cy="66" rx="6" ry="8"
           fill="#8d6e4f" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Tragus (small flap in front of canal) -->
  <path d="M 34 62
             C 32 58, 34 54, 38 54
             C 40 54, 42 56, 40 60
             C 38 64, 34 66, 34 62 Z"
        fill="#ffb74d" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Antitragus (opposite lobe bump) -->
  <path d="M 38 80
             C 34 80, 30 84, 32 90
             C 34 94, 40 94, 42 90
             C 44 86, 42 80, 38 80 Z"
        fill="#ffb74d" stroke="#1f2937" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Earlobe -->
  <path d="M 30 106
             C 26 110, 28 122, 36 124
             C 44 126, 54 120, 52 114
             C 50 108, 38 104, 30 106 Z"
        fill="#ffe0b2" stroke="#1f2937" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Helix rim highlight (inner edge of outer helix) -->
  <path d="M 50 14
             C 62 16, 74 30, 76 52
             C 78 72, 68 96, 56 112"
        fill="none" stroke="#ffb74d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.7"/>
</svg>
