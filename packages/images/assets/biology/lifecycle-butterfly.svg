    <path d="M 20 93 L 15 86 M 20 93 L 25 86" fill="none" stroke="#1f2937" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 18 94 C 4 80 0 90 6 98 C 10 102 16 100 18 96 Z" fill="#fbbf24" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M 22 94 C 36 80 40 90 34 98 C 30 102 24 100 22 96 Z" fill="#fbbf24" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M 18 106 C 6 118 2 110 7 103 C 11 99 16 102 18 106 Z" fill="#e53935" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M 22 106 C 34 118 38 110 33 103 C 29 99 24 102 22 106 Z" fill="#e53935" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="10" cy="92" r="1.6" fill="#1f2937"/>
    <circle cx="30" cy="92" r="1.6" fill="#1f2937"/>
