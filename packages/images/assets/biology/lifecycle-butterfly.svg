  <g>
    <path d="M 80 178 L 120 178" fill="none" stroke="#5d4632" stroke-width="3" stroke-linecap="round"/>
    <path d="M 100 178 L 100 184" fill="none" stroke="#5d4632" stroke-width="2" stroke-linecap="round"/>
    <path d="M 100 184 C 88 184 86 196 92 204 C 96 210 104 210 108 204 C 114 196 112 184 100 184 Z" fill="#b45309" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
