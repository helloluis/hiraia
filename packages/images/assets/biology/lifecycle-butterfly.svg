  <path d="M 72 156 A 70 70 0 0 1 40 100" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 38 108 L 39 99 L 47 105 Z" fill="#1f2937" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M 44 72 A 70 70 0 0 1 100 30" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
