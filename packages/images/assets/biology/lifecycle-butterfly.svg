    <ellipse cx="91" cy="24" rx="2.6" ry="3.4" fill="#fbbf24" stroke="#1f2937" stroke-width="1.4"/>
    <ellipse cx="98" cy="22" rx="2.6" ry="3.4" fill="#fbbf24" stroke="#1f2937" stroke-width="1.4"/>
    <ellipse cx="95" cy="29" rx="2.6" ry="3.4" fill="#fbbf24" stroke="#1f2937" stroke-width="1.4"/>
  </g>

  <!-- Stage 2: green caterpillar (right) -->
  <g>
    <circle cx="172" cy="100" r="9" fill="#7cb342" stroke="#1f2937" stroke-width="2.2"/>
    <circle cx="183" cy="100" r="9" fill="#2e7d32" stroke="#1f2937" stroke-width="2.2"/>
