<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 130" width="110" height="130">
  <!-- Neck -->
  <rect x="42" y="108" width="26" height="18" rx="4" fill="#ffe0b2" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Ears -->
  <ellipse cx="14" cy="68" rx="8" ry="11" fill="#ffe0b2" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <ellipse cx="96" cy="68" rx="8" ry="11" fill="#ffe0b2" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Inner ear detail left -->
  <path d="M16 61 Q19 68 16 75" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Inner ear detail right -->
  <path d="M94 61 Q91 68 94 75" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Head oval -->
  <ellipse cx="55" cy="66" rx="40" ry="52" fill="#ffe0b2" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Hair top -->
  <path d="M18 50 Q20 14 55 12 Q90 14 92 50 Q82 32 55 30 Q28 32 18 50 Z" fill="#5d4632" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <!-- Left eyebrow -->
  <path d="M31 48 Q39 44 47 46" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right eyebrow -->
  <path d="M63 46 Q71 44 79 48" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left eye white -->
  <ellipse cx="39" cy="57" rx="9" ry="7" fill="#ffffff" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right eye white -->
  <ellipse cx="71" cy="57" rx="9" ry="7" fill="#ffffff" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
  <!-- Left iris -->
  <circle cx="39" cy="57" r="5" fill="#37536b"/>
  <!-- Right iris -->
  <circle cx="71" cy="57" r="5" fill="#37536b"/>
  <!-- Left pupil -->
  <circle cx="39" cy="57" r="2.5" fill="#1f2937"/>
  <!-- Right pupil -->
  <circle cx="71" cy="57" r="2.5" fill="#1f2937"/>
  <!-- Left eye highlight -->
  <circle cx="40.5" cy="55.5" r="1.2" fill="#ffffff"/>
  <!-- Right eye highlight -->
  <circle cx="72.5" cy="55.5" r="1.2" fill="#ffffff"/>
  <!-- Nose bridge -->
  <path d="M55 67 Q52 74 50 80 Q55 83 60 80 Q58 74 55 67 Z" fill="#f5c6a0" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Mouth -->
  <path d="M40 96 Q55 106 70 96" fill="none" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Upper lip line -->
  <path d="M44 96 Q49 100 55 98 Q61 100 66 96" fill="none" stroke="#1f2937" stroke-width="1.4" stroke-linecap="round"/>
</svg>
