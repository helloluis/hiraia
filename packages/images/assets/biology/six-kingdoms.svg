<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 170" width="240" height="170">
  <!-- Animalia: a friendly fish -->
  <ellipse cx="42" cy="40" rx="24" ry="14" fill="#4fc3f7" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M64 40 L80 28 L80 52 Z" fill="#4fc3f7" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="30" cy="36" r="3" fill="#1f2937"/>
  <path d="M40 46 q6 5 14 0" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

  <!-- Plantae: a sprout in soil -->
  <path d="M120 56 L120 30" fill="none" stroke="#2e7d32" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M120 40 q-14 -4 -18 -16 q14 0 18 12 Z" fill="#7cb342" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M120 36 q14 -4 18 -16 q-14 0 -18 12 Z" fill="#7cb342" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M106 56 q14 8 28 0" fill="#8d6e4f" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Fungi: a mushroom -->
  <path d="M174 44 q26 0 26 -8 q0 -16 -26 -16 q-26 0 -26 16 q0 8 26 8 Z" fill="#e53935" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="166" cy="28" r="3" fill="#fbbf24"/>
  <circle cx="184" cy="26" r="3" fill="#fbbf24"/>
  <circle cx="176" cy="34" r="2.6" fill="#fbbf24"/>
  <path d="M167 44 L167 58 q7 6 14 0 L181 44 Z" fill="#f3a6b5" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Protista: an amoeba -->
  <path d="M30 120 q-14 -2 -14 -14 q0 -16 16 -16 q10 -8 20 0 q18 -2 18 14 q6 12 -8 16 q-4 14 -18 8 q-12 8 -14 -8 Z" fill="#8e44ad" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="38" cy="106" r="6" fill="#5e3370" stroke="#1f2937" stroke-width="1.6"/>
  <circle cx="55" cy="116" r="3" fill="#5e3370"/>

  <!-- Bacteria: a rod bacterium with flagella -->
  <rect x="100" y="96" width="40" height="20" rx="10" fill="#7cb342" stroke="#1f2937" stroke-width="2.2"/>
  <path d="M111 102 q3 4 8 0 q3 -4 8 0" fill="none" stroke="#2e7d32" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M140 106 q10 -2 16 4 q6 6 14 2" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 106 q-10 2 -16 -4 q-6 -6 -14 -2" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

  <!-- Archaea: a hexagonal-rod microbe with flagella -->
  <path d="M180 96 L210 96 L218 106 L210 116 L180 116 L172 106 Z" fill="#fbbf24" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M191 106 m-4 0 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0" fill="#b8860b" stroke="#1f2937" stroke-width="1.4"/>
  <path d="M218 106 q8 -4 14 0 q6 4 4 -4" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <path d="M218 106 q8 4 14 0 q6 -4 4 4" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

  <!-- divider cross lines grouping the six icons -->
  <line x1="6" y1="72" x2="234" y2="72" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="14" x2="90" y2="158" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <line x1="160" y1="14" x2="160" y2="158" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
</svg>
