<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <!-- Leaf - educational diagram with realistic outline -->
  <!-- Leaf body: tapered oval shape, wider at middle, pointed at tip and base -->
  <path d="M60,10 C70,15 80,25 85,40 C90,55 85,70 75,80 C65,90 55,90 45,80 C35,70 30,55 35,40 C40,25 50,15 60,10 Z"
        fill="#81c784" stroke="#2e7d32" stroke-width="2"/>
  <!-- Central vein (midrib) -->
  <path d="M60,12 L60,82" stroke="#1b5e20" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Secondary veins (right side) -->
  <path d="M60,28 L78,22" stroke="#2e7d32" stroke-width="1" stroke-linecap="round"/>
  <path d="M60,40 L82,35" stroke="#2e7d32" stroke-width="1" stroke-linecap="round"/>
  <path d="M60,52 L80,50" stroke="#2e7d32" stroke-width="1" stroke-linecap="round"/>
  <path d="M60,65 L78,68" stroke="#2e7d32" stroke-width="1" stroke-linecap="round"/>
  <!-- Secondary veins (left side) -->
  <path d="M60,28 L42,22" stroke="#2e7d32" stroke-width="1" stroke-linecap="round"/>
  <path d="M60,40 L38,35" stroke="#2e7d32" stroke-width="1" stroke-linecap="round"/>
  <path d="M60,52 L40,50" stroke="#2e7d32" stroke-width="1" stroke-linecap="round"/>
  <path d="M60,65 L42,68" stroke="#2e7d32" stroke-width="1" stroke-linecap="round"/>
  <!-- Stem -->
  <path d="M60,82 L60,92" stroke="#388e3c" stroke-width="2" stroke-linecap="round"/>
  <!-- Label -->
  <text x="60" y="98" text-anchor="middle" font-size="11" font-weight="bold" font-family="Arial">Leaf</text>
</svg>
