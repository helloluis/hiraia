  <path d="M121 30 L150 78 L92 78 Z" fill="#7cb342" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M121 56 L156 104 L86 104 Z" fill="#2e7d32" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/>

