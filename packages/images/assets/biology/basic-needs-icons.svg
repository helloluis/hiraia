    <path d="M70 50 C70 44 80 44 80 49 C80 54 73 54 73 58" stroke="#4fc3f7" stroke-width="4"/>
  </g>

  <!-- Water (drop) -->
  <g stroke="#1f2937" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
