    <circle cx="178" cy="144" r="40" fill="#fff7e6"/>
    <circle cx="178" cy="144" r="17" fill="#fbbf24"/>
    <g stroke="#fbbf24" stroke-width="4">
      <line x1="178" y1="115" x2="178" y2="122"/>
      <line x1="178" y1="166" x2="178" y2="173"/>
      <line x1="149" y1="144" x2="156" y2="144"/>
      <line x1="200" y1="144" x2="207" y2="144"/>
      <line x1="157" y1="123" x2="162" y2="128"/>
