    <ellipse cx="83" cy="72" rx="7.5" ry="6.5" fill="#7cb342"/>
    <circle cx="62" cy="62" r="2.6" fill="#8e44ad"/>
    <circle cx="76" cy="60" r="2.6" fill="#8e44ad"/>
    <circle cx="69" cy="73" r="2.6" fill="#8e44ad"/>
    <circle cx="83" cy="72" r="2.6" fill="#8e44ad"/>
  </g>

  <!-- arrow 2 -->
  <line x1="93" y1="62" x2="106" y2="56" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M106 56 L100 55.6 L102.3 60.7 Z" fill="#1f2937" stroke="#1f2937" stroke-width="1" stroke-linejoin="round"/>

  <!-- 3. ORGAN (heart) -->
  <path d="M118 58
           C118 50 128 48 130 56
           C132 48 142 50 142 58
           C142 67 130 76 130 76
           C130 76 118 67 118 58 Z"
