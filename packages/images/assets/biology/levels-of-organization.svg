<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 110" width="240" height="110">
  <!-- 1. CELL (smallest) -->
  <ellipse cx="20" cy="78" rx="14" ry="12" fill="#7cb342" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="20" cy="78" r="5" fill="#8e44ad" stroke="#1f2937" stroke-width="2"/>
  <ellipse cx="13" cy="74" rx="2.4" ry="3.4" fill="#fbbf24" stroke="#1f2937" stroke-width="1.4" transform="rotate(-25 13 74)"/>
  <ellipse cx="26" cy="83" rx="2.4" ry="3.4" fill="#4fc3f7" stroke="#1f2937" stroke-width="1.4" transform="rotate(30 26 83)"/>

  <!-- arrow 1 -->
