  <path d="M125 56 C129 58 132 58 136 55" fill="none" stroke="#b71c1c" stroke-width="1.8" stroke-linecap="round"/>

  <!-- arrow 3 -->
  <line x1="150" y1="56" x2="163" y2="50" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M163 50 L157 49.6 L159.3 54.7 Z" fill="#1f2937" stroke="#1f2937" stroke-width="1" stroke-linejoin="round"/>

  <!-- 4. ORGAN SYSTEM (torso outline with organs) -->
  <path d="M176 36
           C176 30 196 30 196 36
           L194 66 C194 72 178 72 178 66 Z"
        fill="#f3a6b5" stroke="#1f2937" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- lungs -->
  <path d="M183 44 C180 46 180 54 183 56 C185 54 185 47 184 44 Z" fill="#4fc3f7" stroke="#1f2937" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M189 44 C192 46 192 54 189 56 C187 54 187 47 188 44 Z" fill="#4fc3f7" stroke="#1f2937" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- heart -->
  <path d="M183 58 C183 55 186 55 186.5 57 C187 55 190 55 190 58 C190 61 186.5 64 186.5 64 C186.5 64 183 61 183 58 Z"
        fill="#e53935" stroke="#1f2937" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- arrow 4 -->
  <line x1="202" y1="48" x2="214" y2="42" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M214 42 L208 41.6 L210.3 46.7 Z" fill="#1f2937" stroke="#1f2937" stroke-width="1" stroke-linejoin="round"/>

  <!-- 5. ORGANISM (whole person, largest) -->
  <circle cx="225" cy="18" r="8.5" fill="#f3a6b5" stroke="#1f2937" stroke-width="2.4"/>
  <path d="M225 26.5 L225 56" stroke="#1565c0" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M225 33 L212 45 M225 33 L238 45" stroke="#1565c0" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M225 56 L215 80 M225 56 L235 80" stroke="#1565c0" stroke-width="3" stroke-linecap="round" fill="none"/>
