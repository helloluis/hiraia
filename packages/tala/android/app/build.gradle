plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hiraia.tala'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hiraia.tala'
        minSdk 29
        targetSdk 35
        versionCode 18
        versionName '0.4.3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        // The pilot's Tala releases are signed with the Android DEBUG certificate
        // (SHA-256 50dcc69a…1703ae). That is deliberate and must not change: it is the
        // established pilot key, and re-keying would stop every existing install from
        // upgrading. `debuggable false` is what makes this a release variant rather than
        // a debug build wearing a release name.
        release {
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.google.android.gms:play-services-nearby:19.4.0'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'androidx.core:core:1.17.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
