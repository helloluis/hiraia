# /etc/systemd/system/hiraia-admin.service.d/crm-cards.conf
#
# CRM contact cards (/admin/crm): the admin server reads the CRM API with its own read-scoped key.
# No secret lives here. deploy/crm/install.sh creates the key on this host (keygen.sh hiraia-admin
# read) and moves it into the root-only file below; crm_contacts.py re-reads that file whenever it
# changes, so `install.sh --rotate-keys` needs no admin restart. Adding or editing this drop-in does:
#   systemctl daemon-reload && systemctl restart hiraia-admin
[Service]
Environment=HIRAIA_CRM_BASE_URL=https://hiraia.org/api/crm
Environment=HIRAIA_CRM_API_KEY_FILE=/etc/hiraia-monitor/crm-admin.key
