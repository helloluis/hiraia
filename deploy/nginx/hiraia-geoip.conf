# Optional GeoIP2. This file is included from the http context.
# Dummy maps keep $geoip2_* defined so nginx -t succeeds before a City MMDB
# is installed. To enable lookups, replace this file with
# hiraia-geoip.conf.example after placing the MMDB on the box.
map $remote_addr $geoip2_country_code { default ""; }
map $remote_addr $geoip2_city_name { default ""; }
