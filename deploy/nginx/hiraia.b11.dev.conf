server {
    server_name hiraia.b11.dev;

    # Static model files (GGUFs) for the on-device app's first-run download. The
    # app modelSrc points here; QVAC fetches + caches on-device, then ALL inference
    # is on-device/offline. This is a verifiable mirror of the public base model.
    location = /models/hiraia-sft-2b-v2.Q4_K_M.gguf {
        add_header Cache-Control "no-store" always;
        return 307 https://assets.hiraia.org/models/hiraia-sft-2b-v2.Q4_K_M.gguf;
    }

    location = /models/labse.Q4_K_M.gguf {
        add_header Cache-Control "no-store" always;
        return 307 https://assets.hiraia.org/models/labse.Q4_K_M.gguf;
    }

    location = /models/vectors-labse-af171fe8a9f9.i8.bin {
        add_header Cache-Control "no-store" always;
        return 307 https://assets.hiraia.org/models/vectors-labse-af171fe8a9f9.i8.bin;
    }

    location = /models/hiraia.apk {
        add_header Cache-Control "no-store" always;
        return 307 https://assets.hiraia.org/models/hiraia.apk;
    }

    location /models/ {
        alias /var/www/hiraia-models/;
        sendfile on;
        tcp_nopush on;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log $hiraia_model_geo_log hiraia_model_geo;
    }

    location = /api/telemetry/batch {
        client_max_body_size 100k;
        client_body_timeout 10s;
        limit_req zone=hiraia_telemetry burst=30 nodelay;
        limit_req_status 429;
        access_log off;
        proxy_pass http://127.0.0.1:8136;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location /admin {
        proxy_pass http://127.0.0.1:8135;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Geo-Country $geoip2_country_code;
        proxy_set_header X-Geo-City $geoip2_city_name;
    }

    location /qvac/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cache-Control 'no-cache';
        proxy_set_header Connection 'keep-alive';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hiraia.b11.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hiraia.b11.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = hiraia.b11.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name hiraia.b11.dev;
    return 404; # managed by Certbot
}
