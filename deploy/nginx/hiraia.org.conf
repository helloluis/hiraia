server {
    server_name hiraia.org www.hiraia.org;

    # Static model files (GGUFs) for the on-device app's first-run download. The
    # app modelSrc points here; QVAC fetches + caches on-device, then ALL inference
    # is on-device/offline. This is a verifiable mirror of the public base model.
    location /models/ {
        alias /var/www/hiraia-models/;
        sendfile on;
        tcp_nopush on;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location /admin {
        proxy_pass http://127.0.0.1:8135;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /qvac/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cache-Control 'no-cache';
        proxy_set_header Connection 'keep-alive';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hiraia.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hiraia.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.hiraia.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = hiraia.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name hiraia.org www.hiraia.org;
    return 404; # managed by Certbot
}
