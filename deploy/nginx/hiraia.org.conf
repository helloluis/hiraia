server {
    server_name hiraia.org www.hiraia.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt-apps;
        default_type text/plain;
        try_files $uri =404;
    }


    # Published PDF lives outside the app checkout so a web redeploy cannot roll it back.
    location = /hiraia-pitch-deck.pdf {
        alias /var/www/hiraia-publications/hiraia-pitch-deck.pdf;
        default_type application/pdf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Short pilot APK download for manual entry on test devices.
    location = /a {
        add_header Cache-Control "no-store" always;
        return 302 https://assets.hiraia.org/models/hiraia-v0p4p41.apk;
    }

    # Static model files (GGUFs) for the on-device app's first-run download. The
    # app modelSrc points here; QVAC fetches + caches on-device, then ALL inference
    # is on-device/offline. This is a verifiable mirror of the public base model.
    location = /models/hiraia-sft-2b-v2.Q4_K_M.gguf {
        add_header Cache-Control "no-store" always;
        return 307 https://assets.hiraia.org/models/hiraia-sft-2b-v2.Q4_K_M.gguf;
    }

    location = /models/labse.Q4_K_M.gguf {
        add_header Cache-Control "no-store" always;
        return 307 https://assets.hiraia.org/models/labse.Q4_K_M.gguf;
    }

    location = /models/vectors-labse-af171fe8a9f9.i8.bin {
        add_header Cache-Control "no-store" always;
        return 307 https://assets.hiraia.org/models/vectors-labse-af171fe8a9f9.i8.bin;
    }

    location = /models/vectors-labse-90318bad81dd.i8.bin {
        add_header Cache-Control "no-store" always;
        return 307 https://assets.hiraia.org/models/vectors-labse-90318bad81dd.i8.bin;
    }

    location = /models/hiraia.apk {
        add_header Cache-Control "no-store" always;
        return 307 https://assets.hiraia.org/models/hiraia.apk;
    }

    location /models/ {
        alias /var/www/hiraia-models/;
        sendfile on;
        tcp_nopush on;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log $hiraia_model_geo_log ovh_hiraia_model_geo;
    }

    location = /api/telemetry/batch {
        client_max_body_size 100k;
        client_body_timeout 10s;
        limit_req zone=ovh_hiraia_telemetry burst=30 nodelay;
        limit_req_status 429;
        access_log off;
        proxy_pass http://127.0.0.1:8136;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/ovh-hiraia-upstream-headers.conf;
        proxy_read_timeout 15s;
    }

    location = /admin/api/tala/reports {
        client_max_body_size 16m;
        client_body_timeout 120s;
        proxy_pass http://127.0.0.1:8135;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/ovh-hiraia-upstream-headers.conf;
        proxy_read_timeout 120s;
    }

    location /admin {
        proxy_pass http://127.0.0.1:8135;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/ovh-hiraia-upstream-headers.conf;
        proxy_read_timeout 60s;
    }

    # Private CRM API (bearer keys are checked by the loopback service; nginx adds the body cap
    # and a per-client request rate). Installed by deploy/crm/install.sh before `location /`.
    location /api/crm/ {
        client_max_body_size 256k;
        client_body_timeout 15s;
        limit_req zone=hiraia_crm burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8137;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/ovh-hiraia-upstream-headers.conf;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/ovh-hiraia-upstream-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Geo-Country $ovh_hiraia_country;
        proxy_set_header X-Geo-City $ovh_hiraia_geoip_city;
    }

    location /qvac/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/ovh-hiraia-upstream-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Cache-Control 'no-cache';
        proxy_set_header Connection 'keep-alive';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/nginx/apps-tls/hiraia.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/nginx/apps-tls/hiraia.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    listen 80;
    server_name hiraia.org www.hiraia.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt-apps;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
