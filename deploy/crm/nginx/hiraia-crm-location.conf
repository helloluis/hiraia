    # Private CRM API (bearer keys are checked by the loopback service; nginx adds the body cap
    # and a per-client request rate). Installed by deploy/crm/install.sh before `location /`.
    location /api/crm/ {
        client_max_body_size 256k;
        client_body_timeout 15s;
        limit_req zone=hiraia_crm burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8137;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/ovh-hiraia-upstream-headers.conf;
        proxy_read_timeout 30s;
    }

