    # BEGIN hiraia-voice-demo (deploy/voice-demo/install.sh) — public TTS demo for the
    # "Hiraia Voices" section; loopback :8139. Body/text caps, per-client rate, timeouts.
    location = /api/voice/synthesize {
        limit_except POST { deny all; }
        client_max_body_size 8k;
        client_body_timeout 10s;
        limit_req zone=hiraia_voice burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8139;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/ovh-hiraia-upstream-headers.conf;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 40s;
    }
    location = /api/voice/health {
        limit_req zone=hiraia_voice burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8139;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/ovh-hiraia-upstream-headers.conf;
        proxy_read_timeout 5s;
    }
    # END hiraia-voice-demo
