# Drop-in for the existing hiraia-admin.service; preserves its account/session config.
[Service]
ExecStart=
ExecStart=/opt/hiraia-analytics-venv/bin/python /opt/hiraia-monitor/admin_app.py
Environment=HIRAIA_TELEMETRY_DB_PATH=/var/lib/hiraia-telemetry/telemetry.db
Environment=HIRAIA_DB_PATH=/var/lib/hiraia/hiraia.db
